name: Agent XPUB/backfill/labels bootstrap

on:
  push:
    branches:
      - agent/sentinel-market-cache-cleanup
    paths:
      - .github/workflows/agent-xpub-backfill-labels.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/sentinel-market-cache-cleanup
          fetch-depth: 0

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          comp = root / 'custom_components' / 'bitcoin_stack_tracker'

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: pattern not found in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # ---------- Market rating labels: editable text, but never score-affecting ----------
          buy = comp / 'buy_opportunity.py'
          text = buy.read_text(encoding='utf-8')
          needle = '''DEFAULT_THRESHOLDS: dict[str, float] = {
              "very_expensive_max": 20.0,
              "expensive_max": 35.0,
              "interesting": 50.0,
              "cheap": 65.0,
              "very_cheap": 80.0,
              "extreme": 90.0,
          }
          '''
          addition = needle + '''
          RATING_KEYS = (
              "very_expensive", "expensive", "neutral", "interesting",
              "cheap", "very_cheap", "extreme",
          )
          MAX_RATING_LABEL_LENGTH = 120


          def score_affecting_settings(settings: Mapping[str, Any] | None) -> dict[str, Any]:
              """Return only settings that can change numeric scores or rating bands.

              User-facing rating text is deliberately excluded. Renaming e.g.
              ``very_cheap`` must never invalidate years of cached score history
              or restart the 90-day intraday reconstruction.
              """
              payload = dict(settings or {})
              payload.pop("labels", None)
              return payload
          '''
          if needle not in text:
              raise SystemExit('buy labels constants pattern missing')
          text = text.replace(needle, addition, 1)
          old = '''    raw_model = raw.get("model") if isinstance(raw.get("model"), Mapping) else {}
          '''
          new = '''    raw_labels = raw.get("labels") if isinstance(raw.get("labels"), Mapping) else {}
              labels: dict[str, str] = {}
              for key in RATING_KEYS:
                  value = str(raw_labels.get(key) or "") if isinstance(raw_labels, Mapping) else ""
                  # Keep labels display-only and safe for HTML/UI transport. The
                  # frontend escapes them again before inserting text into markup.
                  value = "".join(char for char in value.strip() if ord(char) >= 32 and ord(char) != 127)
                  labels[key] = value[:MAX_RATING_LABEL_LENGTH]

              raw_model = raw.get("model") if isinstance(raw.get("model"), Mapping) else {}
          '''
          if old not in text:
              raise SystemExit('buy raw_model insertion missing')
          text = text.replace(old, new, 1)
          old = '''        "thresholds": thresholds,
                  "model": model,
          '''
          new = '''        "thresholds": thresholds,
                  "labels": labels,
                  "model": model,
          '''
          if old not in text:
              raise SystemExit('buy return labels insertion missing')
          text = text.replace(old, new, 1)
          buy.write_text(text, encoding='utf-8')

          # Cache signatures must ignore display-only labels.
          hist_cache = comp / 'market_assessment_history_cache.py'
          replace_once(hist_cache,
              'from .buy_opportunity import SCORE_VERSION\n',
              'from .buy_opportunity import SCORE_VERSION, score_affecting_settings\n',
              'history cache import')
          replace_once(hist_cache,
              '        "settings": settings,\n',
              '        "settings": score_affecting_settings(settings),\n',
              'history cache score settings')

          intra = comp / 'market_assessment_intraday_cache.py'
          replace_once(intra,
              'from .buy_opportunity import SCORE_VERSION\n',
              'from .buy_opportunity import SCORE_VERSION, score_affecting_settings\n',
              'intraday cache import')
          replace_once(intra,
              '        "settings": settings,\n',
              '        "settings": score_affecting_settings(settings),\n',
              'intraday cache score settings')
          text = intra.read_text(encoding='utf-8')
          marker = '''    async def async_points(self, signature: str, *, since: datetime | None = None) -> list[dict[str, Any]]:
          '''
          stats = '''    async def async_stats(self, signature: str) -> dict[str, Any]:
              """Return lightweight 90-day cache completeness diagnostics."""
              async with self._lock:
                  if str(self._data.get("signature") or "") != str(signature):
                      return {
                          "cached_points": 0, "live_points": 0, "backfilled_points": 0,
                          "expected_full_grid_points": _RETENTION_DAYS * _BUCKETS_PER_DAY,
                          "oldest_timestamp": None, "newest_timestamp": None,
                      }
                  points = [item for item in self._data.get("points", []) if isinstance(item, dict)]
                  live = sum(1 for item in points if not bool(item.get("backfilled")))
                  backfilled = len(points) - live
                  ordered = sorted(str(item.get("timestamp") or "") for item in points if item.get("timestamp"))
                  return {
                      "cached_points": len(points),
                      "live_points": live,
                      "backfilled_points": backfilled,
                      "expected_full_grid_points": _RETENTION_DAYS * _BUCKETS_PER_DAY,
                      "oldest_timestamp": ordered[0] if ordered else None,
                      "newest_timestamp": ordered[-1] if ordered else None,
                  }

          ''' + marker
          if marker not in text:
              raise SystemExit('intraday stats insertion missing')
          text = text.replace(marker, stats, 1)
          intra.write_text(text, encoding='utf-8')

          runtime = comp / 'market_assessment_runtime.py'
          replace_once(runtime,
              'from .buy_opportunity import calculate_buy_opportunity, normalize_buy_opportunity_settings\n',
              'from .buy_opportunity import calculate_buy_opportunity, normalize_buy_opportunity_settings, score_affecting_settings\n',
              'runtime import')
          replace_once(runtime,
              '        repr(scoring_settings),\n',
              '        repr(score_affecting_settings(scoring_settings)),\n',
              'runtime structural labels exclusion')

          # ---------- Raw XPUB auto detection ----------
          wallet = comp / 'wallet_watch.py'
          text = wallet.read_text(encoding='utf-8')
          pattern = re.compile(r'    async def _resolve_xpub_address_type\(.*?\n    async def _probe_gap_address_used\(', re.S)
          replacement = '''    async def _resolve_xpub_address_type(
              self, monitor: dict[str, Any], source: dict[str, Any], *, electrum_client: _ElectrumRPCClient | None
          ) -> tuple[str, bool]:
              """Resolve an ambiguous plain xpub and report whether history proved it.

              A raw xpub does not encode P2PKH/P2SH-P2WPKH/P2WPKH/P2TR intent.
              Auto therefore probes the actual derived addresses. Electrum uses
              the lightweight subscription status hash instead of downloading
              full histories for four candidate families. A no-history fallback
              is explicitly *provisional* and is never persisted as a verified
              answer, preventing a false 0-BTC 2+2 state from becoming sticky.
              """
              requested = str(monitor.get("address_type") or "auto").strip().lower()
              extpub = str(monitor.get("value") or "")
              root = _parse_extpub(extpub)
              if requested != "auto":
                  return requested, True
              if not extpub.lower().startswith("xpub"):
                  return root.script_type, True

              for candidate_index, script_type in enumerate(_XPUB_AUTO_CANDIDATES):
                  addresses: list[str] = []
                  for branch, gap_key in ((0, "receive_count"), (1, "change_count")):
                      configured = max(0, int(monitor.get(gap_key) or 0))
                      if configured <= 0:
                          continue
                      count = min(
                          MAX_DERIVED_PER_BRANCH,
                          max(configured, HD_DISCOVERY_BOOTSTRAP_ADDRESSES),
                      )
                      for index in range(count):
                          row = derive_extpub_branch_address(
                              extpub, branch, index, address_type=script_type
                          )
                          addresses.append(str(row["address"]))

                  detected = False
                  if electrum_client is not None:
                      calls = [
                          ("blockchain.scripthash.subscribe", [_electrum_scripthash(address)])
                          for address in addresses
                      ]
                      statuses = await self._electrum_calls_chunked(
                          electrum_client, calls, chunk_size=ELECTRUM_STATUS_BATCH_SIZE
                      )
                      detected = any(status not in {None, ""} for status in statuses)
                  else:
                      # Same-node HTTP fallback; stop immediately once a family
                      # proves historical use instead of walking all four.
                      for address in addresses:
                          if await self._probe_gap_address_used(source, address):
                              detected = True
                              break

                  if detected:
                      return script_type, True
                  if candidate_index + 1 < len(_XPUB_AUTO_CANDIDATES):
                      await asyncio.sleep(GAP_DISCOVERY_YIELD_SECONDS)

              # Native SegWit remains the provisional display/derivation default,
              # but callers must keep verified=False and retry discovery later.
              return "p2wpkh", False

              async def _probe_gap_address_used('''
          match = pattern.search(text)
          if not match:
              raise SystemExit('xpub resolver block missing')
          text = text[:match.start()] + replacement + text[match.end():]
          # Fix indentation/token introduced by replacing through function opening.
          text = text.replace('              async def _probe_gap_address_used(\n        self, source:', '    async def _probe_gap_address_used(\n        self, source:', 1)

          old = '''                resolved_type = await self._resolve_xpub_address_type(
                      monitor, source, electrum_client=client
                  )
                  monitor["_resolved_address_type"] = resolved_type
          '''
          new = '''                resolved_type, resolved_verified = await self._resolve_xpub_address_type(
                      monitor, source, electrum_client=client
                  )
                  monitor["_resolved_address_type"] = resolved_type
                  monitor["_resolved_address_type_verified"] = bool(resolved_verified)
          '''
          if old not in text:
              raise SystemExit('xpub discovery resolver call missing')
          text = text.replace(old, new, 1)

          old = '''            "resolved_address_type": (
                          str(monitor.get("_resolved_address_type") or monitor.get("address_type") or "auto")
                          if str(monitor.get("kind") or "") == "xpub" else ""
                      ),
          '''
          new = old + '''            "resolved_address_type_verified": (
                          bool(monitor.get("_resolved_address_type_verified"))
                          if str(monitor.get("kind") or "") == "xpub" else True
                      ),
          '''
          if old not in text:
              raise SystemExit('runtime row resolved type missing')
          text = text.replace(old, new, 1)

          # Preserve verification metadata through runtime row state merges.
          old = '''            "last_activity_at", "last_balance_refresh_unix",
                  ):
          '''
          new = '''            "last_activity_at", "last_balance_refresh_unix",
                      "resolved_address_type", "resolved_address_type_verified",
                  ):
          '''
          if old not in text:
              raise SystemExit('runtime merge keys missing')
          text = text.replace(old, new, 1)

          # Catalog persistence: resolved type is only authoritative when verified.
          old = '''        resolved_by_monitor = {
                      str(row.get("monitor_id") or ""): str(row.get("resolved_address_type") or "")
                      for row in new_addresses
                      if str(row.get("monitor_id") or "") and str(row.get("resolved_address_type") or "")
                  }
                  for item in catalog:
                      monitor_id = str(item.get("id") or "")
                      if monitor_id in resolved_by_monitor:
                          item["resolved_address_type"] = resolved_by_monitor[monitor_id]
          '''
          new = '''        resolved_by_monitor = {
                      str(row.get("monitor_id") or ""): (
                          str(row.get("resolved_address_type") or ""),
                          bool(row.get("resolved_address_type_verified")),
                      )
                      for row in new_addresses
                      if str(row.get("monitor_id") or "") and str(row.get("resolved_address_type") or "")
                  }
                  for item in catalog:
                      monitor_id = str(item.get("id") or "")
                      if monitor_id in resolved_by_monitor:
                          resolved_type, resolved_verified = resolved_by_monitor[monitor_id]
                          item["resolved_address_type"] = resolved_type
                          item["resolved_address_type_verified"] = resolved_verified
          '''
          if old not in text:
              raise SystemExit('catalog resolved persistence missing')
          text = text.replace(old, new, 1)

          # A provisional raw-xpub guess must not satisfy future runtime matching.
          old = '''            if kind == "xpub" and str(monitor.get("address_type") or "auto") == "auto":
                          resolved_type = str(runtime_item.get("resolved_address_type") or "")
                          if resolved_type not in _XPUB_AUTO_CANDIDATES:
                              return False
          '''
          new = '''            if kind == "xpub" and str(monitor.get("address_type") or "auto") == "auto":
                          resolved_type = str(runtime_item.get("resolved_address_type") or "")
                          if resolved_type not in _XPUB_AUTO_CANDIDATES:
                              return False
                          if not bool(runtime_item.get("resolved_address_type_verified")):
                              return False
          '''
          if old not in text:
              raise SystemExit('runtime matching xpub block missing')
          text = text.replace(old, new, 1)

          # Per-monitor status exposes detection state, so UI never calls a provisional zero final.
          old = '''                    "baseline_complete": True,
                              },
                          )
          '''
          new = '''                    "baseline_complete": True,
                                  "resolved_address_type": "",
                                  "resolved_address_type_verified": False,
                              },
                          )
          '''
          if old not in text:
              raise SystemExit('monitor summary init missing')
          text = text.replace(old, new, 1)
          old = '''            summary["balance_sats"] += int(row.get("balance_sats") or 0)
                      summary["utxo_count"] += int(row.get("utxo_count") or 0)
          '''
          new = '''            summary["balance_sats"] += int(row.get("balance_sats") or 0)
                      summary["utxo_count"] += int(row.get("utxo_count") or 0)
                      if row.get("resolved_address_type"):
                          summary["resolved_address_type"] = str(row.get("resolved_address_type") or "")
                          summary["resolved_address_type_verified"] = bool(row.get("resolved_address_type_verified"))
          '''
          if old not in text:
              raise SystemExit('monitor summary resolved state missing')
          text = text.replace(old, new, 1)
          wallet.write_text(text, encoding='utf-8')

          # ---------- Wire throttled 90-day backfill + expose completeness ----------
          init = comp / '__init__.py'
          text = init.read_text(encoding='utf-8')
          text = text.replace(
              '    normalize_buy_opportunity_settings,\n)',
              '    normalize_buy_opportunity_settings,\n    score_affecting_settings,\n)', 1)
          anchor = '''from .market_assessment_history_cache import (
              MarketAssessmentHistoryCache,
              market_assessment_history_signature,
          )
          '''
          if anchor not in text:
              raise SystemExit('market history import anchor missing')
          text = text.replace(anchor, anchor + 'from .market_assessment_backfill import async_market_assessment_backfill_loop\n', 1)

          schema_anchor = '''BUY_OPPORTUNITY_MODEL_SCHEMA = vol.Schema({
          '''
          labels_schema = '''BUY_OPPORTUNITY_LABELS_SCHEMA = vol.Schema({
              vol.Optional(key): vol.All(cv.string, vol.Length(max=120))
              for key in ("very_expensive", "expensive", "neutral", "interesting", "cheap", "very_cheap", "extreme")
          })
          ''' + schema_anchor
          if schema_anchor not in text:
              raise SystemExit('label schema anchor missing')
          text = text.replace(schema_anchor, labels_schema, 1)
          old = '''    vol.Optional("thresholds"): BUY_OPPORTUNITY_THRESHOLDS_SCHEMA,
              vol.Optional("model"): BUY_OPPORTUNITY_MODEL_SCHEMA,
          '''
          new = '''    vol.Optional("thresholds"): BUY_OPPORTUNITY_THRESHOLDS_SCHEMA,
              vol.Optional("labels"): BUY_OPPORTUNITY_LABELS_SCHEMA,
              vol.Optional("model"): BUY_OPPORTUNITY_MODEL_SCHEMA,
          '''
          if old not in text:
              raise SystemExit('settings schema labels insertion missing')
          text = text.replace(old, new, 1)

          # Keep labels when merging settings.
          old = '''                "thresholds": dict(current["thresholds"]),
                          "model": dict(current["model"]),
          '''
          new = '''                "thresholds": dict(current["thresholds"]),
                          "labels": dict(current.get("labels", {})),
                          "model": dict(current["model"]),
          '''
          if old not in text:
              raise SystemExit('merged labels anchor missing')
          text = text.replace(old, new, 1)
          old = '''            if isinstance(call.data.get("thresholds"), dict):
                          merged["thresholds"].update(call.data["thresholds"])
          '''
          new = old + '''            if isinstance(call.data.get("labels"), dict):
                          merged["labels"].update(call.data["labels"])
          '''
          if old not in text:
              raise SystemExit('labels update anchor missing')
          text = text.replace(old, new, 1)

          # Helper starts/restarts one background task per entry.
          setup_anchor = '''async def async_setup_entry(hass: HomeAssistant, entry: ConfigEntry) -> bool:
          '''
          helper = '''def _start_market_assessment_backfill(
              hass: HomeAssistant, entry: ConfigEntry, runtime: dict[str, Any]
          ) -> None:
              old = runtime.get("market_assessment_backfill_task")
              if old is not None and not old.done():
                  old.cancel()
              runtime["market_assessment_backfill_task"] = hass.async_create_task(
                  async_market_assessment_backfill_loop(
                      hass, entry, runtime["history_storage"], runtime["market_assessment_intraday_cache"]
                  ),
                  "Bitcoin Stack Tracker 90-day market assessment backfill",
              )


          ''' + setup_anchor
          if setup_anchor not in text:
              raise SystemExit('setup helper anchor missing')
          text = text.replace(setup_anchor, helper, 1)

          old = '''    _configure_history_timer(
                  hass, entry, runtime, sync_if_stale=True
              )
          '''
          new = old + '''    _start_market_assessment_backfill(hass, entry, runtime)
          '''
          if old not in text:
              raise SystemExit('backfill setup start anchor missing')
          text = text.replace(old, new, 1)

          # Remove intraday cache on config-entry deletion too.
          old = '''    market_history_cache = MarketAssessmentHistoryCache(hass, entry.entry_id)
              await market_history_cache.async_load()
          '''
          new = old + '''    market_intraday_cache = MarketAssessmentIntradayCache(hass, entry.entry_id)
              await market_intraday_cache.async_load()
          '''
          if old not in text:
              raise SystemExit('remove intraday load anchor missing')
          text = text.replace(old, new, 1)
          old = '''    await market_history_cache.async_remove()
              await ledger_store.async_remove()
          '''
          new = '''    await market_history_cache.async_remove()
              await market_intraday_cache.async_remove()
              await ledger_store.async_remove()
          '''
          if old not in text:
              raise SystemExit('remove intraday remove anchor missing')
          text = text.replace(old, new, 1)

          # Cancel backfill cleanly on unload.
          old = '''    market_task = runtime.get("_market_assessment_task") if isinstance(runtime, dict) else None
          '''
          new = '''    backfill_task = runtime.get("market_assessment_backfill_task") if isinstance(runtime, dict) else None
              if backfill_task is not None and not backfill_task.done():
                  backfill_task.cancel()
                  try:
                      await backfill_task
                  except asyncio.CancelledError:
                      pass
              market_task = runtime.get("_market_assessment_task") if isinstance(runtime, dict) else None
          '''
          if old not in text:
              raise SystemExit('unload backfill cancellation anchor missing')
          text = text.replace(old, new, 1)

          # Label-only changes must not clear/recompute any scores. Numeric/model changes do.
          old = '''        options = dict(entry.options)
                  options[CONF_BUY_OPPORTUNITY_SETTINGS] = normalized
                  hass.config_entries.async_update_entry(entry, options=options)
                  runtime = _runtime(hass, entry_id)
                  invalidate_market_assessment_cache(hass, entry_id)
                  for task in list(runtime.get("_market_assessment_history_tasks", {}).values()):
                      if task is not None and not task.done():
                          task.cancel()
                  runtime["_market_assessment_history_tasks"] = {}
                  await runtime["market_assessment_history_cache"].async_clear()
                  await runtime["market_assessment_intraday_cache"].async_clear()
          '''
          new = '''        score_settings_changed = score_affecting_settings(current) != score_affecting_settings(normalized)
                  options = dict(entry.options)
                  options[CONF_BUY_OPPORTUNITY_SETTINGS] = normalized
                  hass.config_entries.async_update_entry(entry, options=options)
                  runtime = _runtime(hass, entry_id)
                  if score_settings_changed:
                      invalidate_market_assessment_cache(hass, entry_id)
                      for task in list(runtime.get("_market_assessment_history_tasks", {}).values()):
                          if task is not None and not task.done():
                              task.cancel()
                      runtime["_market_assessment_history_tasks"] = {}
                      await runtime["market_assessment_history_cache"].async_clear()
                      await runtime["market_assessment_intraday_cache"].async_clear()
                      runtime["market_assessment_backfill_status"] = {
                          "state": "restart_scheduled", "complete": False,
                          "updated_at": datetime.now(timezone.utc).isoformat(),
                      }
                      _start_market_assessment_backfill(hass, entry, runtime)
          '''
          if old not in text:
              raise SystemExit('label-only invalidation block missing')
          text = text.replace(old, new, 1)

          # Attach backfill progress and cache counts to every history payload.
          old = '''            async def _with_intraday(payload: dict[str, Any]) -> dict[str, Any]:
                          if intraday_days <= 0:
                              return payload
                          intraday_cache = runtime.get("market_assessment_intraday_cache")
                          if intraday_cache is None:
                              return payload
                          since = datetime.now(timezone.utc) - timedelta(days=intraday_days)
                          points = await intraday_cache.async_points(intraday_signature, since=since)
                          return {**payload, "intraday_points": points}
          '''
          new = '''            async def _with_intraday(payload: dict[str, Any]) -> dict[str, Any]:
                          intraday_cache = runtime.get("market_assessment_intraday_cache")
                          backfill_status = deepcopy(runtime.get("market_assessment_backfill_status") or {})
                          if intraday_cache is not None:
                              backfill_status.update(await intraday_cache.async_stats(intraday_signature))
                          enriched = {**payload, "intraday_backfill": backfill_status}
                          if intraday_days <= 0 or intraday_cache is None:
                              return enriched
                          since = datetime.now(timezone.utc) - timedelta(days=intraday_days)
                          points = await intraday_cache.async_points(intraday_signature, since=since)
                          return {**enriched, "intraday_points": points}
          '''
          if old not in text:
              raise SystemExit('history backfill status block missing')
          text = text.replace(old, new, 1)
          init.write_text(text, encoding='utf-8')

          # ---------- Frontend: custom labels + explicit backfill progress + non-final XPUB zero ----------
          index = comp / 'frontend' / 'index.html'
          text = index.read_text(encoding='utf-8')
          old = '''          </div>
                    <div id="buyOpportunitySettingsPreview" class="result"></div>
          '''
          labels_html = '''          </div>
                    <div class="analysis-head"><span class="kicker">RATING LABELS</span><h3>Eigene Bezeichnungen</h3></div>
                    <p class="storage-note">Nur Anzeigetext. Eigene Namen verändern weder Score noch Rückrechnung und können jederzeit wieder geleert werden.</p>
                    <div class="buy-opportunity-threshold-grid buy-opportunity-label-grid">
                      <label><span data-i18n="ratingVeryExpensive">Sehr hoch bewertet</span><input name="label_very_expensive" type="text" maxlength="120" placeholder="Standard"></label>
                      <label><span data-i18n="ratingExpensive">Hoch bewertet</span><input name="label_expensive" type="text" maxlength="120" placeholder="Standard"></label>
                      <label><span data-i18n="ratingNeutral">Neutral</span><input name="label_neutral" type="text" maxlength="120" placeholder="Standard"></label>
                      <label><span data-i18n="ratingInteresting">Interessant</span><input name="label_interesting" type="text" maxlength="120" placeholder="Standard"></label>
                      <label><span data-i18n="ratingCheap">Günstig</span><input name="label_cheap" type="text" maxlength="120" placeholder="Standard"></label>
                      <label><span data-i18n="ratingVeryCheap">Sehr günstig</span><input name="label_very_cheap" type="text" maxlength="120" placeholder="Standard"></label>
                      <label><span data-i18n="ratingExtreme">Extrem günstig</span><input name="label_extreme" type="text" maxlength="120" placeholder="Standard"></label>
                    </div>
                    <div id="buyOpportunitySettingsPreview" class="result"></div>
          '''
          if old not in text:
              raise SystemExit('rating labels html anchor missing')
          text = text.replace(old, labels_html, 1)

name: Dependency security

on:
  push:
    branches: [main]
    paths:
      - "custom_components/bitcoin_stack_tracker/manifest.json"
      - "DEPENDENCIES.lock"
      - ".github/workflows/dependency-security.yml"
  pull_request:
    paths:
      - "custom_components/bitcoin_stack_tracker/manifest.json"
      - "DEPENDENCIES.lock"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build audit requirements from Home Assistant manifest
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest = json.loads(Path("custom_components/bitcoin_stack_tracker/manifest.json").read_text(encoding="utf-8"))
          requirements = manifest.get("requirements", [])
          Path(".dependency-audit-requirements.txt").write_text("\n".join(requirements) + "\n", encoding="utf-8")

      - name: Check dependency lock matches manifest
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest = json.loads(Path("custom_components/bitcoin_stack_tracker/manifest.json").read_text(encoding="utf-8"))
          expected = sorted(str(item).strip() for item in manifest.get("requirements", []) if str(item).strip())
          lock = []
          for line in Path("DEPENDENCIES.lock").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if line and not line.startswith("#"):
                  lock.append(line)
          actual = sorted(lock)
          if actual != expected:
              raise SystemExit(f"DEPENDENCIES.lock differs from manifest.json\nmanifest={expected}\nlock={actual}")

      - name: Audit pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input "pip-audit>=2.9,<3"
          python -m pip_audit -r .dependency-audit-requirements.txt --strict

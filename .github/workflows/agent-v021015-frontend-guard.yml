name: Agent v0.21.0.15 frontend guard

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-v021015-frontend-guard.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v0.21.0.15-hacs-upgrade-progress
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Harden frontend revision ownership
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          comp = root / 'custom_components/bitcoin_stack_tracker'

          panel_py_path = comp / 'panel.py'
          panel_py = panel_py_path.read_text(encoding='utf-8')
          old = 'PANEL_ELEMENT = "bitcoin-stack-tracker-panel-" + "".join(ch if ch.isalnum() else "-" for ch in FRONTEND_BUILD.lower()).strip("-")\n'
          new = ('_PANEL_BUILD_TOKEN = "".join(ch if ch.isalnum() else "-" for ch in FRONTEND_BUILD.lower()).strip("-")\n'
                 '_PANEL_CACHE_TOKEN = "".join(ch if ch.isalnum() else "-" for ch in FRONTEND_CACHE_REVISION.lower()).strip("-")\n'
                 'PANEL_ELEMENT = f"bitcoin-stack-tracker-panel-{_PANEL_BUILD_TOKEN}-r{_PANEL_CACHE_TOKEN}"\n')
          if old not in panel_py:
              raise SystemExit('panel.py element marker missing')
          panel_py_path.write_text(panel_py.replace(old, new, 1), encoding='utf-8')

          panel_js_path = comp / 'frontend/panel.js'
          panel_js = panel_js_path.read_text(encoding='utf-8')
          top_old = ('const FRONTEND_BUILD = "0.21.0.15";\n'
                     'const RPC_SOURCE = "bitcoin-stack-tracker-native";\n'
                     'const PANEL_ELEMENT = `bitcoin-stack-tracker-panel-${FRONTEND_BUILD.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")}`;\n')
          top_new = ('const FRONTEND_BUILD = "0.21.0.15";\n'
                     'const FRONTEND_CACHE_REVISION = "10";\n'
                     'const RPC_SOURCE = "bitcoin-stack-tracker-native";\n'
                     'const PANEL_BUILD_TOKEN = FRONTEND_BUILD.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");\n'
                     'const PANEL_CACHE_TOKEN = FRONTEND_CACHE_REVISION.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");\n'
                     'const PANEL_ELEMENT = `bitcoin-stack-tracker-panel-${PANEL_BUILD_TOKEN}-r${PANEL_CACHE_TOKEN}`;\n')
          if top_old not in panel_js:
              raise SystemExit('panel.js header marker missing')
          panel_js = panel_js.replace(top_old, top_new, 1)
          frame_old = ('      frameUrl.searchParams.set("v", FRONTEND_BUILD);\n'
                       '      frameUrl.searchParams.set("panel_build", FRONTEND_BUILD);\n')
          frame_new = ('      frameUrl.searchParams.set("v", FRONTEND_BUILD);\n'
                       '      frameUrl.searchParams.set("r", FRONTEND_CACHE_REVISION);\n'
                       '      frameUrl.searchParams.set("panel_build", `${FRONTEND_BUILD}-r${FRONTEND_CACHE_REVISION}`);\n')
          if frame_old not in panel_js:
              raise SystemExit('panel.js iframe marker missing')
          panel_js_path.write_text(panel_js.replace(frame_old, frame_new, 1), encoding='utf-8')

          app_path = comp / 'frontend/static/app.js'
          app = app_path.read_text(encoding='utf-8')
          # Privacy-first migration: ignore any legacy per-device opt-in after the
          # broken upgrade generation. The user can explicitly opt in again.
          if 'bst_walletwatch_show_when_locked:v1:' not in app:
              raise SystemExit('locked Sentinel v1 key missing')
          app = app.replace('bst_walletwatch_show_when_locked:v1:', 'bst_walletwatch_show_when_locked:v2:', 1)
          marker = 'const FRONTEND_BUILD = "0.21.0.15";\n'
          if marker not in app:
              raise SystemExit('app frontend build marker missing')
          app = app.replace(marker, marker + 'const FRONTEND_CACHE_REVISION = "10";\n', 1)
          app = app.replace(
              'window.__BITCOIN_STACK_TRACKER_FRONTEND_BUILD__ = FRONTEND_BUILD;',
              'window.__BITCOIN_STACK_TRACKER_FRONTEND_BUILD__ = FRONTEND_BUILD;\nwindow.__BITCOIN_STACK_TRACKER_FRONTEND_CACHE_REVISION__ = FRONTEND_CACHE_REVISION;',
              1,
          )
          app_path.write_text(app, encoding='utf-8')

          test_path = root / 'tests/test_hacs_upgrade_market_progress.py'
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              'APP = (COMP / "frontend/static/app.js").read_text(encoding="utf-8")\n',
              'APP = (COMP / "frontend/static/app.js").read_text(encoding="utf-8")\nPANEL = (COMP / "frontend/panel.js").read_text(encoding="utf-8")\nPANEL_PY = (COMP / "panel.py").read_text(encoding="utf-8")\n',
              1,
          )
          extra = '''\n\ndef test_panel_and_iframe_force_the_same_cache_revision():\n    revision = re.search(r'FRONTEND_CACHE_REVISION = "([^"]+)"', CONST).group(1)\n    assert f'const FRONTEND_CACHE_REVISION = "{revision}";' in PANEL\n    assert 'frameUrl.searchParams.set("r", FRONTEND_CACHE_REVISION);' in PANEL\n    assert '${FRONTEND_BUILD}-r${FRONTEND_CACHE_REVISION}' in PANEL\n    assert '_PANEL_CACHE_TOKEN' in PANEL_PY\n    assert '-r{_PANEL_CACHE_TOKEN}' in PANEL_PY\n\n\ndef test_locked_sentinel_upgrade_is_privacy_first():\n    assert 'bst_walletwatch_show_when_locked:v2:' in APP\n    assert 'function hideLockedWalletWatch()' in APP\n    assert 'if(!walletWatchShowWhenLocked())hideLockedWalletWatch();' in APP\n    assert '!walletWatchShowWhenLocked()||!state.walletWatch?.status' in APP\n'''
          if 'test_panel_and_iframe_force_the_same_cache_revision' not in test:
              test += extra
          test_path.write_text(test, encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          anchor_en = '- Fixed HACS upgrades continuing to execute an older Bitcoin Stack Tracker frontend even after the integration files and Home Assistant Core were restarted.\n'
          if anchor_en in changelog and 'custom-element/iframe revision' not in changelog:
              changelog = changelog.replace(anchor_en, anchor_en + '- Panel custom-element/iframe revision is now forced by the loaded panel module itself, and the locked-Sentinel per-device opt-in starts a new privacy-first generation.\n', 1)
          anchor_de = '- HACS-Updatefehler behoben, bei dem trotz aktualisierter Integrationsdateien und Core-Neustart ein älteres Bitcoin-Stack-Tracker-Frontend weiterlief.\n'
          if anchor_de in changelog and 'Custom-Element-/Iframe-Revision' not in changelog:
              changelog = changelog.replace(anchor_de, anchor_de + '- Custom-Element-/Iframe-Revision wird jetzt vom geladenen Panel-Modul selbst erzwungen; die gerätespezifische Sentinel-Sperrbildschirm-Freigabe startet wieder Privacy-First.\n', 1)
          changelog_path.write_text(changelog, encoding='utf-8')

      - name: Validate frontend guard
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8,<10'
          python -m compileall -q custom_components/bitcoin_stack_tracker
          node --check custom_components/bitcoin_stack_tracker/frontend/static/app.js
          node --check custom_components/bitcoin_stack_tracker/frontend/panel.js
          node tests/performance_math_test.js
          pytest -q tests/test_hacs_upgrade_market_progress.py tests/test_market_backfill_lifecycle.py tests/test_sentinel_autolock_visibility.py tests/test_xpub_backfill_rating_regressions.py tests/test_release_features.py tests/test_buy_opportunity.py

      - name: Commit guard and remove temporary workflow
        run: |
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git rm .github/workflows/agent-v021015-frontend-guard.yml
          git add CHANGELOG.md tests/test_hacs_upgrade_market_progress.py \
            custom_components/bitcoin_stack_tracker/panel.py \
            custom_components/bitcoin_stack_tracker/frontend/panel.js \
            custom_components/bitcoin_stack_tracker/frontend/static/app.js
          git commit -m "Harden v0.21.0.15 frontend upgrade isolation"
          git push origin HEAD:fix/v0.21.0.15-hacs-upgrade-progress

name: Verify v0.21.0.15 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-verify-v021015-release.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Wait for and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.21.0.15"
          archive="bitcoin-stack-tracker-home-assistant-${tag}.zip"
          checksum="${archive}.sha256"
          for attempt in $(seq 1 24); do
            assets="$(gh release view "${tag}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            if grep -Fxq "${archive}" <<<"${assets}" && grep -Fxq "${checksum}" <<<"${assets}"; then
              break
            fi
            if [ "${attempt}" -eq 24 ]; then
              echo "Release assets did not appear in time"
              exit 1
            fi
            sleep 10
          done
          rm -rf /tmp/bst-release && mkdir -p /tmp/bst-release
          gh release download "${tag}" --dir /tmp/bst-release --pattern "${archive}" --pattern "${checksum}"
          cd /tmp/bst-release
          sha256sum -c "${checksum}"
          unzip -p "${archive}" "bitcoin-stack-tracker-${tag}/VERSION.txt" | grep -Fxq "0.21.0.15"
          echo "v0.21.0.15 release and SHA-256 assets verified"

      - name: Remove temporary verifier workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git rm .github/workflows/agent-verify-v021015-release.yml
          git commit -m "Remove temporary v0.21.0.15 release verifier"
          git push origin HEAD:main

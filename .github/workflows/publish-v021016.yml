name: Publish v0.21.0.16

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v021016.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify version
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION.txt)" = "0.21.0.16"
          grep -q '"version": "0.21.0.16"' custom_components/bitcoin_stack_tracker/manifest.json
          grep -q 'VERSION = "0.21.0.16"' custom_components/bitcoin_stack_tracker/const.py

      - name: Update changelog and README
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          section = """## v0.21.0.16 — 2026-09-13: current booking value & configurable holding cutoff

          ### English

          - Ledger bookings now show the **current fiat value** of the booked BTC amount and the **percentage development since the booking** directly below the existing historical fiat total, so the desktop table keeps its previous column count.
          - The holding-period tab adds a configurable **cutoff date model**. Acquisitions before the cutoff keep the configured holding period; acquisitions on or after the cutoff remain in the existing short-term/taxable model bucket and never receive a future long-term date.
          - The cutoff simulation shows separate cards for BTC under the normal holding rule and BTC that will never become long-term under the configured model.
          - Cutoff lots are listed as **Acquired · Status · Open**. Clicking **Acquired** toggles ascending/descending sorting; dates are displayed as `YYYY MM DD`.
          - The current-value comparison is fee-aware: purchase/income fees increase the historical acquisition total, while sale/expense fees reduce historical proceeds.
          - The release keeps the original ledger width and contains no DOM `MutationObserver`, preventing the vault-unlock render loop discovered during VM testing.
          - Home Assistant custom integration: **v0.21.0.16**. Tor Gateway remains **v0.21.0.3**.

          ### Deutsch

          - Einzelne Buchungen zeigen jetzt den **heutigen Fiatwert** der gebuchten BTC-Menge sowie die **prozentuale Entwicklung seit der Buchung** direkt unter dem bestehenden historischen Fiat-Gesamtbetrag. Dadurch bleibt die bisherige Spaltenzahl der Desktop-Tabelle erhalten.
          - Im Reiter Haltezeit gibt es einen frei wählbaren **Stichtag als Modellfunktion**. Erwerbe vor dem Stichtag folgen weiter der eingestellten Haltefrist; Erwerbe am oder nach dem Stichtag bleiben im Modell dauerhaft im steuerpflichtigen Kurzzeit-Bereich und erhalten kein zukünftiges Langzeitdatum.
          - Die Stichtag-Simulation zeigt getrennte Karten für BTC mit normaler Haltefrist und BTC, die im gewählten Modell nie Langzeit werden.
          - Die Stichtag-Tabelle ist als **Erworben · Status · Offen** aufgebaut. Ein Klick auf **Erworben** wechselt zwischen auf- und absteigender Sortierung; das Datum erscheint als `JJJJ MM TT`.
          - Die Entwicklung je Buchung berücksichtigt Gebühren: Bei Kauf/Einnahme erhöhen Fiatgebühren den historischen Einstand, bei Verkauf/Ausgabe reduzieren sie den historischen Erlös.
          - Die ursprüngliche Tabellenbreite bleibt erhalten und die Release-Oberfläche verwendet keinen DOM-`MutationObserver`; damit ist die im VM-Test gefundene Entsperr-Endlosschleife ausgeschlossen.
          - Home-Assistant-Custom-Integration: **v0.21.0.16**. Tor Gateway bleibt **v0.21.0.3**.
          """
          if "## v0.21.0.16" not in changelog:
              if not changelog.startswith("# Changelog\n"):
                  raise SystemExit("Unexpected CHANGELOG header")
              changelog = changelog.replace("# Changelog\n", "# Changelog\n\n" + section.strip() + "\n\n", 1)
              changelog_path.write_text(changelog, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace("# Bitcoin Stack Tracker v0.21.0.15", "# Bitcoin Stack Tracker v0.21.0.16", 1)

          en = """Current project version: **v0.21.0.16**. This release adds current value/performance directly to each ledger booking without widening the table and introduces a configurable holding-period cutoff model in the holding-period tab.

          #### Highlights in v0.21.0.16

          - current fiat value and percentage development per booking
          - no additional desktop ledger column and therefore no new horizontal scrollbar
          - configurable cutoff: acquisitions before it keep the normal holding rule; acquisitions on/after it never become long-term in the model
          - separate summary cards for normal-rule BTC and never-long-term BTC
          - sortable cutoff table with `YYYY MM DD` acquisition dates
          - unlock-loop regression fix retained: no self-triggering DOM MutationObserver
          - HACS validation, Hassfest validation and dependency-security checks passed"""
          readme, en_count = re.subn(
              r"Current project version: \*\*v0\.21\.0\.15\*\*\..*?(?=\n\n\*\*After updating)",
              en,
              readme,
              count=1,
              flags=re.S,
          )

          de = """Aktueller Projektstand: **v0.21.0.16**. Dieses Release ergänzt bei jeder Buchung den heutigen Wert samt prozentualer Entwicklung, ohne die Tabelle zu verbreitern, und fügt im Reiter Haltezeit einen frei einstellbaren Stichtag als Modellfunktion hinzu.

          #### Highlights in v0.21.0.16

          - heutiger Fiatwert und prozentuale Entwicklung je Buchung
          - keine zusätzliche Desktop-Spalte und damit kein neuer horizontaler Scrollbalken
          - frei wählbarer Stichtag: Erwerbe davor folgen der normalen Haltefrist; Erwerbe am/danach werden im Modell nie Langzeit
          - getrennte Karten für normale Haltefrist und nie Langzeit werdende BTC
          - sortierbare Stichtag-Tabelle mit Erwerbsdatum `JJJJ MM TT`
          - Unlock-Regressionsfix bleibt erhalten: kein selbsttriggernder DOM-MutationObserver
          - HACS-, Hassfest- und Dependency-Security-Prüfungen bestanden"""
          readme, de_count = re.subn(
              r"Aktueller Projektstand: \*\*v0\.21\.0\.15\*\*\..*?(?=\n\n\*\*Nach dem Update)",
              de,
              readme,
              count=1,
              flags=re.S,
          )
          if en_count != 1 or de_count != 1:
              raise SystemExit(f"README release section replacement failed: en={en_count} de={de_count}")
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Commit release documentation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md README.md; then
            echo "Release documentation already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md README.md
            git commit -m "docs: document v0.21.0.16"
            git push origin HEAD:main
          fi

      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION.txt)"
          tag="v${version}"
          target="$(git rev-parse HEAD)"
          notes="$(mktemp)"
          cat > "${notes}" <<'EOF'
          ## Bitcoin Stack Tracker v0.21.0.16

          ### Deutsch
          - Buchungen zeigen jetzt den heutigen Fiatwert der gebuchten BTC-Menge und die prozentuale Entwicklung direkt unter dem historischen Fiat-Gesamtbetrag – ohne zusätzliche Tabellenspalte.
          - Neuer frei wählbarer Stichtag im Reiter **Haltezeit**: Erwerbe vor dem Stichtag folgen der normalen Haltefrist; Erwerbe am oder danach bleiben im Modell dauerhaft steuerpflichtig / nie Langzeit.
          - Getrennte Karten für normale Haltefrist und nie Langzeit werdende BTC.
          - Stichtag-Tabelle **Erworben · Status · Offen**, Datum `JJJJ MM TT`, Sortierung per Klick auf **Erworben**.
          - Unlock-Regression aus dem VM-Test behoben; kein selbsttriggernder MutationObserver.

          ### English
          - Ledger bookings now show current fiat value and percentage development below the historical fiat total without adding a table column.
          - New configurable holding cutoff in the **Holding period** tab: acquisitions before the cutoff keep the normal rule; acquisitions on/after it never become long-term in the model.
          - Separate normal-rule / never-long-term summary cards and sortable `YYYY MM DD` cutoff rows.
          - Vault-unlock render-loop regression remains fixed.

          ### Validation
          - HACS validation: passed
          - Hassfest validation: passed
          - Dependency security: passed
          - Local Python/JavaScript syntax and focused booking/cutoff regression checks: passed

          Custom Integration: **v0.21.0.16**  
          Tor Gateway: **v0.21.0.3 unchanged**
          EOF

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --target "${target}" --title "v0.21.0.16 · Booking values & holding cutoff" --notes-file "${notes}"
          fi

          archive="bitcoin-stack-tracker-home-assistant-${tag}.zip"
          prefix="bitcoin-stack-tracker-${tag}/"
          git archive --format=zip --prefix="${prefix}" -o "${archive}" "${target}"
          sha256sum "${archive}" > "${archive}.sha256"
          sha256sum -c "${archive}.sha256"
          gh release upload "${tag}" "${archive}" "${archive}.sha256" --clobber

name: Agent v0.21.0.15 upgrade-cache hotfix

on:
  push:
    branches:
      - hotfix/hacs-frontend-cache-v0.21.0.15
    paths:
      - .github/workflows/agent-hotfix-v021015-upgrade-cache.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/hacs-frontend-cache-v0.21.0.15
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Patch upgrade-safe frontend delivery
        shell: python
        run: |
          from pathlib import Path
          import json

          root = Path('.')
          comp = root / 'custom_components/bitcoin_stack_tracker'
          old = '0.21.0.14'
          new = '0.21.0.15'
          rev_old = '8'
          rev_new = '9'

          # Version-bearing runtime files only; do not rewrite historical changelog entries.
          for rel in [
              'VERSION.txt',
              'custom_components/bitcoin_stack_tracker/manifest.json',
              'custom_components/bitcoin_stack_tracker/const.py',
              'custom_components/bitcoin_stack_tracker/wallet_watch.py',
              'custom_components/bitcoin_stack_tracker/frontend/index.html',
              'custom_components/bitcoin_stack_tracker/frontend/panel.js',
              'custom_components/bitcoin_stack_tracker/frontend/static/app.js',
          ]:
              p = root / rel
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{old} missing in {rel}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          const_path = comp / 'const.py'
          const = const_path.read_text(encoding='utf-8')
          needle = f'FRONTEND_CACHE_REVISION = "{rev_old}"'
          if needle not in const:
              raise SystemExit('old frontend cache revision missing')
          const = const.replace(needle, f'FRONTEND_CACHE_REVISION = "{rev_new}"', 1)
          const_path.write_text(const, encoding='utf-8')

          # A versioned *URL namespace* makes HACS upgrades independent from browser,
          # WebView, service-worker and pre-release query-string caches while keeping
          # stable file names (index.html, panel.js, app.js, style.css, performance-math.js).
          panel_path = comp / 'panel.py'
          panel_path.write_text('''"""Native Home Assistant frontend registration for Bitcoin Stack Tracker."""

          from __future__ import annotations

          import logging
          from pathlib import Path

          from homeassistant.components import frontend, panel_custom
          from homeassistant.components.http import StaticPathConfig
          from homeassistant.core import HomeAssistant

          from .const import DOMAIN, FRONTEND_BUILD, FRONTEND_CACHE_REVISION, VERSION

          _LOGGER = logging.getLogger(__name__)

          PANEL_URL_PATH = "bitcoin-stack-tracker"
          _BUILD_TOKEN = "".join(ch if ch.isalnum() else "-" for ch in FRONTEND_BUILD.lower()).strip("-")
          _CACHE_TOKEN = "".join(ch if ch.isalnum() else "-" for ch in FRONTEND_CACHE_REVISION.lower()).strip("-")
          PANEL_ELEMENT = f"bitcoin-stack-tracker-panel-{_BUILD_TOKEN}-r{_CACHE_TOKEN}"
          STATIC_BASE_URL = "/api/bitcoin_stack_tracker/frontend"
          STATIC_URL = f"{STATIC_BASE_URL}-{_BUILD_TOKEN}-r{_CACHE_TOKEN}"


          async def async_register_native_panel(hass: HomeAssistant) -> bool:
              """Register the native Home Assistant sidebar panel upgrade-safely.

              The stable legacy static route remains available for an already-open old
              panel during an in-place reload. Every actual build additionally receives
              a unique sibling URL namespace, so a HACS update can never resolve a new
              panel/index/app request to bytes cached for an earlier build candidate.
              """
              domain_data = hass.data.setdefault(DOMAIN, {})
              frontend_dir = Path(__file__).parent / "frontend"

              if not domain_data.get("_native_static_registered"):
                  for static_url in (STATIC_BASE_URL, STATIC_URL):
                      try:
                          await hass.http.async_register_static_paths(
                              [StaticPathConfig(static_url, str(frontend_dir), cache_headers=False)]
                          )
                      except RuntimeError as err:
                          # Reloads can leave an already-registered route in aiohttp.
                          # Register routes independently so one existing legacy path
                          # never prevents the new build-specific path from being added.
                          _LOGGER.debug("Bitcoin Stack frontend static path %s already registered: %s", static_url, err)
                  domain_data["_native_static_registered"] = True

              if domain_data.get("_native_panel_registered") and frontend.async_panel_exists(
                  hass, PANEL_URL_PATH
              ):
                  return True

              if frontend.async_panel_exists(hass, PANEL_URL_PATH):
                  frontend.async_remove_panel(hass, PANEL_URL_PATH, warn_if_unknown=False)

              try:
                  await panel_custom.async_register_panel(
                      hass,
                      webcomponent_name=PANEL_ELEMENT,
                      frontend_url_path=PANEL_URL_PATH,
                      sidebar_title="Bitcoin Stack",
                      sidebar_icon="mdi:bitcoin",
                      module_url=f"{STATIC_URL}/panel.js?v={FRONTEND_BUILD}&r={FRONTEND_CACHE_REVISION}",
                      embed_iframe=False,
                      require_admin=False,
                      config={
                          "frontend_url": f"{STATIC_URL}/index.html?native=1&v={FRONTEND_BUILD}&r={FRONTEND_CACHE_REVISION}",
                          "version": VERSION,
                          "frontend_build": FRONTEND_BUILD,
                          "frontend_cache_revision": FRONTEND_CACHE_REVISION,
                          "frontend_static_url": STATIC_URL,
                          "architecture": "native-core-panel",
                      },
                  )
              except Exception:  # noqa: BLE001 - backend must stay up if UI registration fails
                  domain_data["_native_panel_registered"] = False
                  _LOGGER.exception(
                      "Could not register Bitcoin Stack native panel. The tracker backend remains loaded; "
                      "restart Home Assistant Core after updating the custom integration."
                  )
                  return False

              domain_data["_native_panel_registered"] = True
              _LOGGER.info(
                  "Bitcoin Stack native panel registered at /%s with frontend %s r%s",
                  PANEL_URL_PATH,
                  FRONTEND_BUILD,
                  FRONTEND_CACHE_REVISION,
              )
              return True
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          # Force panel.js and its iframe to the exact same build+revision namespace.
          panel_js_path = comp / 'frontend/panel.js'
          panel_js = panel_js_path.read_text(encoding='utf-8')
          if 'const FRONTEND_CACHE_REVISION' not in panel_js:
              panel_js = panel_js.replace(
                  f'const FRONTEND_BUILD = "{new}";\n',
                  f'const FRONTEND_BUILD = "{new}";\nconst FRONTEND_CACHE_REVISION = "{rev_new}";\n',
                  1,
              )
          old_element = 'const PANEL_ELEMENT = `bitcoin-stack-tracker-panel-${FRONTEND_BUILD.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "-")}`;'
          # Current source strips leading/trailing dashes with an empty replacement.
          actual_element = 'const PANEL_ELEMENT = `bitcoin-stack-tracker-panel-${FRONTEND_BUILD.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")}`;'
          if actual_element not in panel_js:
              raise SystemExit('panel element expression not found')
          panel_js = panel_js.replace(
              actual_element,
              'const FRONTEND_BUILD_TOKEN = FRONTEND_BUILD.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");\n'
              'const FRONTEND_CACHE_TOKEN = FRONTEND_CACHE_REVISION.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");\n'
              'const PANEL_ELEMENT = `bitcoin-stack-tracker-panel-${FRONTEND_BUILD_TOKEN}-r${FRONTEND_CACHE_TOKEN}`;',
              1,
          )
          old_src = '    const src = this._panel?.config?.frontend_url || "/api/bitcoin_stack_tracker/frontend/index.html?native=1";\n'
          if old_src not in panel_js:
              raise SystemExit('panel iframe source declaration not found')
          panel_js = panel_js.replace(
              old_src,
              '    // Resolve the iframe from this module URL, not from possibly stale panel config.\n'
              '    // The module itself lives in a build-specific static namespace.\n'
              '    const moduleBase = new URL("./", import.meta.url);\n',
              1,
          )
          panel_js = panel_js.replace(
              '    logo.src = "/api/bitcoin_stack_tracker/frontend/static/assets/bitcoin-stack-tracker-logo.png";',
              '    logo.src = new URL("static/assets/bitcoin-stack-tracker-logo.png", moduleBase).toString();',
              1,
          )
          old_frame = '''    let frameSrc = src;
              try {
                const frameUrl = new URL(src, window.location.origin);
                // Never trust a panel config object that may have survived an in-place
                // Home Assistant frontend update. Force the iframe to this module build.
                frameUrl.searchParams.set("v", FRONTEND_BUILD);
                frameUrl.searchParams.set("panel_build", FRONTEND_BUILD);
                frameSrc = frameUrl.toString();
              } catch (_error) {}
              frame.src = frameSrc;
              frame.dataset.frontendBuild = FRONTEND_BUILD;'''.replace('\n              ', '\n    ')
          if old_frame not in panel_js:
              raise SystemExit('old iframe build-forcing block not found')
          new_frame = '''    const frameUrl = new URL("index.html", moduleBase);
              frameUrl.searchParams.set("native", "1");
              frameUrl.searchParams.set("v", FRONTEND_BUILD);
              frameUrl.searchParams.set("r", FRONTEND_CACHE_REVISION);
              frameUrl.searchParams.set("panel_build", `${FRONTEND_BUILD}-r${FRONTEND_CACHE_REVISION}`);
              frame.src = frameUrl.toString();
              frame.dataset.frontendBuild = FRONTEND_BUILD;
              frame.dataset.frontendCacheRevision = FRONTEND_CACHE_REVISION;'''.replace('\n              ', '\n    ')
          panel_js = panel_js.replace(old_frame, new_frame, 1)
          panel_js_path.write_text(panel_js, encoding='utf-8')

          # index.html previously shipped r=6 while const.py declared r=8. That
          # allowed a pre-release app.js for the same v0.21.0.14 URL to survive an
          # HACS update. Make every asset URL use the one release revision.
          index_path = comp / 'frontend/index.html'
          index = index_path.read_text(encoding='utf-8')
          index = index.replace(f'v={new}&r=6', f'v={new}&r={rev_new}')
          index = index.replace(
              f'static/performance-math.js?v={new}"',
              f'static/performance-math.js?v={new}&r={rev_new}"',
          )
          for asset in ('style.css', 'app.js', 'performance-math.js'):
              expected = f'{asset}?v={new}&r={rev_new}'
              if expected not in index:
                  raise SystemExit(f'consistent cache revision missing for {asset}')
          index_path.write_text(index, encoding='utf-8')

          # Privacy-first migration: an old per-device opt-in must never survive a
          # frontend generation change accidentally. Users can explicitly enable it
          # again after the hotfix. This is deliberately a new localStorage key.
          app_path = comp / 'frontend/static/app.js'
          app = app_path.read_text(encoding='utf-8')
          if 'bst_walletwatch_show_when_locked:v1:' not in app:
              raise SystemExit('old locked-Sentinel localStorage generation missing')
          app = app.replace('bst_walletwatch_show_when_locked:v1:', 'bst_walletwatch_show_when_locked:v2:', 1)
          build_marker = f'const FRONTEND_BUILD = "{new}";\n'
          if build_marker in app and 'const FRONTEND_CACHE_REVISION = "9";' not in app:
              app = app.replace(
                  build_marker,
                  build_marker + f'const FRONTEND_CACHE_REVISION = "{rev_new}";\n',
                  1,
              )
              app = app.replace(
                  'window.__BITCOIN_STACK_TRACKER_FRONTEND_BUILD__ = FRONTEND_BUILD;',
                  'window.__BITCOIN_STACK_TRACKER_FRONTEND_BUILD__ = FRONTEND_BUILD;\nwindow.__BITCOIN_STACK_TRACKER_FRONTEND_CACHE_REVISION__ = FRONTEND_CACHE_REVISION;',
                  1,
              )
          app_path.write_text(app, encoding='utf-8')

          # Release/readme metadata for the testable hotfix branch.
          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('# Bitcoin Stack Tracker v0.21.0.14', '# Bitcoin Stack Tracker v0.21.0.15', 1)
          readme = readme.replace('Current project version: **v0.21.0.14**.', 'Current project version: **v0.21.0.15**.', 1)
          readme = readme.replace('Aktueller Projektstand: **v0.21.0.14**.', 'Aktueller Projektstand: **v0.21.0.15**.', 1)
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '''## v0.21.0.15 — 2026-08-20: HACS upgrade frontend cache hotfix\n\n### English\n- Fixed HACS upgrades continuing to execute an older Bitcoin Stack Tracker frontend even after the integration files and Home Assistant Core were restarted.\n- Frontend delivery now uses a build+cache-revision-specific URL namespace while keeping stable filenames. `panel.js`, the iframe, `index.html`, CSS, app JS and performance math are pinned to one revision.\n- Fixed the v0.21.0.14 release inconsistency where `FRONTEND_CACHE_REVISION` was 8 but `index.html` still requested app/style with `r=6`.\n- Locked-vault Sentinel display opt-in moves to a new privacy-first localStorage generation and therefore defaults to hidden after this hotfix.\n- Added release-integrity regression checks for the static namespace, asset revision, locked-Sentinel gating and 90-day reconstruction status UI.\n\n### Deutsch\n- HACS-Updatefehler behoben, bei dem trotz aktualisierter Integrationsdateien und Core-Neustart ein älteres Bitcoin-Stack-Tracker-Frontend weiterlief.\n- Frontend-Auslieferung nutzt jetzt einen eigenen URL-Namensraum pro Build+Cache-Revision, behält aber stabile Dateinamen. `panel.js`, Iframe, `index.html`, CSS, App-JS und Performance-Math werden auf dieselbe Revision festgelegt.\n- Inkonsistenz aus v0.21.0.14 behoben: `FRONTEND_CACHE_REVISION` stand auf 8, während `index.html` App/CSS noch mit `r=6` anforderte.\n- Die Sentinel-Anzeige bei gesperrtem Tresor verwendet eine neue Privacy-First-localStorage-Generation und ist nach diesem Hotfix wieder standardmäßig aus.\n- Regressionstests sichern URL-Namensraum, Asset-Revision, Sentinel-Sperrlogik und die Anzeige des 90-Tage-Rückrechnungsstatus ab.\n\n'''
          if '## v0.21.0.15 ' not in changelog:
              changelog = changelog.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          # Replace the stale hard-coded v0.21.0.12 integrity test with checks that
          # derive the current version/revision from source and can catch this bug.
          test_path = root / 'tests/test_frontend_release_integrity.py'
          test_path.write_text(r'''from pathlib import Path
          import re

          ROOT = Path(__file__).resolve().parents[1]
          COMP = ROOT / "custom_components" / "bitcoin_stack_tracker"
          APP = (COMP / "frontend/static/app.js").read_text(encoding="utf-8")
          PANEL = (COMP / "frontend/panel.js").read_text(encoding="utf-8")
          INDEX = (COMP / "frontend/index.html").read_text(encoding="utf-8")
          CSS = (COMP / "frontend/static/style.css").read_text(encoding="utf-8")
          CONST = (COMP / "const.py").read_text(encoding="utf-8")
          PANEL_PY = (COMP / "panel.py").read_text(encoding="utf-8")

          VERSION = re.search(r'^VERSION = "([^"]+)"', CONST, re.M).group(1)
          CACHE_REVISION = re.search(r'^FRONTEND_CACHE_REVISION = "([^"]+)"', CONST, re.M).group(1)


          def test_heavy_tabs_render_lazily():
              block = APP.split("function renderAll()", 1)[1].split("function lifetimeFiatSecured", 1)[0]
              assert "renderActiveTabContent(state.activeTab);" in block
              assert "renderOverview(); renderLedger();" not in block


          def test_network_polling_is_visibility_aware_and_less_aggressive():
              block = APP.split("function startNetworkPolling()", 1)[1].split("function renderSecurity", 1)[0]
              assert "if(document.hidden)return;" in block
              assert "},30000);" in block
              assert "},4000);" not in block


          def test_resize_work_waits_until_viewport_settles():
              assert "function scheduleViewportSettledWork()" in APP
              assert 'window.addEventListener("resize",scheduleViewportSettledWork,{passive:true});' in APP
              assert '}, 220);' in APP
              assert "viewport-resizing" in APP


          def test_fifo_mobile_fiat_values_hide_in_fiat_free_mode():
              assert "body.fiat-free-mode .fifo-fiat-metric{display:none!important}" in CSS


          def test_menu_uses_home_assistant_custom_panel_toggle_event():
              assert 'this.dispatchEvent(new CustomEvent("hass-toggle-menu"' in PANEL
              assert 'external.fireMessage' not in PANEL
              assert 'home-assistant-main' not in PANEL


          def test_frontend_release_uses_stable_filenames_but_unique_build_namespace():
              frontend = COMP / "frontend"
              static = frontend / "static"
              assert (frontend / "index.html").is_file()
              assert (frontend / "panel.js").is_file()
              assert (static / "app.js").is_file()
              assert (static / "style.css").is_file()
              assert (static / "performance-math.js").is_file()
              assert not list(frontend.glob("index-v*.html"))
              assert not list(frontend.glob("panel-v*.js"))
              assert not list(static.glob("app-v*.js"))
              assert 'STATIC_BASE_URL = "/api/bitcoin_stack_tracker/frontend"' in PANEL_PY
              assert 'STATIC_URL = f"{STATIC_BASE_URL}-{_BUILD_TOKEN}-r{_CACHE_TOKEN}"' in PANEL_PY
              assert 'module_url=f"{STATIC_URL}/panel.js?v={FRONTEND_BUILD}&r={FRONTEND_CACHE_REVISION}"' in PANEL_PY
              assert '"frontend_url": f"{STATIC_URL}/index.html?native=1&v={FRONTEND_BUILD}&r={FRONTEND_CACHE_REVISION}"' in PANEL_PY
              assert 'const FRONTEND_CACHE_REVISION' in PANEL
              assert 'frameUrl.searchParams.set("r", FRONTEND_CACHE_REVISION);' in PANEL
              assert 'new URL("index.html", moduleBase)' in PANEL


          def test_all_index_assets_share_current_version_and_cache_revision():
              for asset in ("style.css", "app.js", "performance-math.js"):
                  assert f"{asset}?v={VERSION}&r={CACHE_REVISION}" in INDEX
              assert f"const BUILD_VERSION = \"{VERSION}\";" in APP
              assert f"const FRONTEND_BUILD = \"{VERSION}\";" in APP
              assert f"const FRONTEND_CACHE_REVISION = \"{CACHE_REVISION}\";" in APP
              assert f"const FRONTEND_BUILD = \"{VERSION}\";" in PANEL
              assert f"const FRONTEND_CACHE_REVISION = \"{CACHE_REVISION}\";" in PANEL


          def test_locked_sentinel_is_privacy_first_after_upgrade_and_autolock():
              assert 'bst_walletwatch_show_when_locked:v2:' in APP
              assert 'function hideLockedWalletWatch()' in APP
              assert 'if(!walletWatchShowWhenLocked())hideLockedWalletWatch();' in APP
              assert 'if(!state.data?.locked||!walletWatchShowWhenLocked()||!state.walletWatch?.status)' in APP


          def test_market_backfill_status_ui_is_present_in_release_assets():
              assert 'id="marketAssessmentBackfillStatus"' in INDEX
              assert 'function renderMarketAssessmentBackfillStatus' in APP
              assert '90-Tage-Rückrechnung' in APP
              assert 'expected_source_points' in APP
              assert 'interval_minutes||15' in APP
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

      - name: Validate hotfix
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8,<10'
          python -m compileall -q custom_components/bitcoin_stack_tracker
          node --check custom_components/bitcoin_stack_tracker/frontend/static/app.js
          node --check custom_components/bitcoin_stack_tracker/frontend/panel.js
          node tests/performance_math_test.js
          pytest -q tests/test_frontend_release_integrity.py tests/test_market_backfill_lifecycle.py tests/test_sentinel_autolock_visibility.py tests/test_xpub_backfill_rating_regressions.py tests/test_release_features.py tests/test_github_release_surface.py tests/test_buy_opportunity.py
          test "$(tr -d '[:space:]' < VERSION.txt)" = "0.21.0.15"
          grep -q '"version": "0.21.0.15"' custom_components/bitcoin_stack_tracker/manifest.json
          grep -q 'FRONTEND_CACHE_REVISION = "9"' custom_components/bitcoin_stack_tracker/const.py

      - name: Commit hotfix and remove one-shot workflow
        run: |
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git rm .github/workflows/agent-hotfix-v021015-upgrade-cache.yml
          git add VERSION.txt README.md CHANGELOG.md tests/test_frontend_release_integrity.py \
            custom_components/bitcoin_stack_tracker/manifest.json \
            custom_components/bitcoin_stack_tracker/const.py \
            custom_components/bitcoin_stack_tracker/panel.py \
            custom_components/bitcoin_stack_tracker/wallet_watch.py \
            custom_components/bitcoin_stack_tracker/frontend/index.html \
            custom_components/bitcoin_stack_tracker/frontend/panel.js \
            custom_components/bitcoin_stack_tracker/frontend/static/app.js
          git commit -m "Fix HACS upgrade frontend cache isolation"
          git push origin HEAD:hotfix/hacs-frontend-cache-v0.21.0.15

name: Build v0.21.0.15 release assets
on:
  push:
    branches: [main]
    paths: [.github/workflows/agent-release-assets-v021015.yml]
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Build upload and verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=v0.21.0.15
          archive=bitcoin-stack-tracker-home-assistant-${tag}.zip
          git archive --format=zip --prefix=bitcoin-stack-tracker-${tag}/ -o ${archive} ${tag}
          sha256sum ${archive} > ${archive}.sha256
          sha256sum -c ${archive}.sha256
          gh release upload ${tag} ${archive} ${archive}.sha256 --clobber
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          gh release download ${tag} --dir /tmp/verify --pattern ${archive} --pattern ${archive}.sha256
          cd /tmp/verify
          sha256sum -c ${archive}.sha256
          unzip -p ${archive} bitcoin-stack-tracker-${tag}/VERSION.txt | grep -Fxq 0.21.0.15
      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git rm .github/workflows/agent-release-assets-v021015.yml
          git commit -m "Remove temporary v0.21.0.15 asset publisher"
          git push origin HEAD:main

name: Agent v0.21.0.15 PR hotfix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-hotfix-v021015-pr-trigger.yml
      - .github/workflows/agent-hotfix-v021015-upgrade-cache.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/hacs-frontend-cache-v0.21.0.15
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply embedded hotfix patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/agent-hotfix-v021015-upgrade-cache.yml').read_text(encoding='utf-8')
          marker = '      - name: Patch upgrade-safe frontend delivery\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Validate hotfix\n'
          if marker not in workflow or end_marker not in workflow:
              raise SystemExit('embedded patch block not found')
          block = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          code = textwrap.dedent(block)
          exec(compile(code, '<v0.21.0.15-hotfix>', 'exec'), {'__name__': '__main__'})

      - name: Validate hotfix
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8,<10'
          python -m compileall -q custom_components/bitcoin_stack_tracker
          node --check custom_components/bitcoin_stack_tracker/frontend/static/app.js
          node --check custom_components/bitcoin_stack_tracker/frontend/panel.js
          node tests/performance_math_test.js
          pytest -q tests/test_frontend_release_integrity.py tests/test_market_backfill_lifecycle.py tests/test_sentinel_autolock_visibility.py tests/test_xpub_backfill_rating_regressions.py tests/test_release_features.py tests/test_github_release_surface.py tests/test_buy_opportunity.py
          test "$(tr -d '[:space:]' < VERSION.txt)" = "0.21.0.15"
          grep -q '"version": "0.21.0.15"' custom_components/bitcoin_stack_tracker/manifest.json
          grep -q 'FRONTEND_CACHE_REVISION = "9"' custom_components/bitcoin_stack_tracker/const.py

      - name: Commit hotfix
        run: |
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git rm .github/workflows/agent-hotfix-v021015-upgrade-cache.yml .github/workflows/agent-hotfix-v021015-pr-trigger.yml
          git add VERSION.txt README.md CHANGELOG.md tests/test_frontend_release_integrity.py \
            custom_components/bitcoin_stack_tracker/manifest.json \
            custom_components/bitcoin_stack_tracker/const.py \
            custom_components/bitcoin_stack_tracker/panel.py \
            custom_components/bitcoin_stack_tracker/wallet_watch.py \
            custom_components/bitcoin_stack_tracker/frontend/index.html \
            custom_components/bitcoin_stack_tracker/frontend/panel.js \
            custom_components/bitcoin_stack_tracker/frontend/static/app.js
          git commit -m "Fix HACS upgrade frontend cache isolation"
          git push origin HEAD:hotfix/hacs-frontend-cache-v0.21.0.15

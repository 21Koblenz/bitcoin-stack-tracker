name: Agent definitive backfill lifecycle fix

on:
  push:
    branches:
      - agent/sentinel-market-cache-cleanup
    paths:
      - .github/workflows/agent-startup-backfill-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/sentinel-market-cache-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10'
      - name: Apply lifecycle fix
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          comp = root / 'custom_components' / 'bitcoin_stack_tracker'

          init = comp / '__init__.py'
          text = init.read_text(encoding='utf-8')
          old = '''    runtime["market_assessment_backfill_task"] = hass.async_create_task(
        async_market_assessment_backfill_loop(
            hass, entry, runtime["history_storage"], runtime["market_assessment_intraday_cache"]
        ),
        "Bitcoin Stack Tracker 90-day market assessment backfill",
    )'''
          new = '''    runtime["market_assessment_backfill_task"] = entry.async_create_background_task(
        hass,
        async_market_assessment_backfill_loop(
            hass, entry, runtime["history_storage"], runtime["market_assessment_intraday_cache"]
        ),
        "Bitcoin Stack Tracker 90-day market assessment backfill",
    )'''
          if old not in text:
              raise SystemExit('setup backfill task pattern missing')
          text = text.replace(old, new, 1)

          old = '''            runtime["history_auto_last_result"] = "startup-sync-scheduled"
            hass.async_create_task(_scheduled_sync(dt_util.utcnow()))'''
          new = '''            runtime["history_auto_last_result"] = "startup-sync-scheduled"
            entry.async_create_background_task(
                hass,
                _scheduled_sync(dt_util.utcnow()),
                f"Bitcoin Stack Tracker startup history sync {entry.entry_id}",
            )'''
          if old in text:
              text = text.replace(old, new, 1)
          init.write_text(text, encoding='utf-8')

          runtime_path = comp / 'market_assessment_runtime.py'
          rt = runtime_path.read_text(encoding='utf-8')
          rt = rt.replace('from .market_assessment_backfill import async_market_assessment_backfill_loop\n', '', 1)
          rt = rt.replace('_BACKFILL_TASK_KEY = "_market_assessment_backfill_task"\n', '', 1)
          start = rt.find('def _ensure_backfill(\n')
          end = rt.find('\n\nasync def async_market_assessment(', start)
          if start < 0 or end <= start:
              raise SystemExit('runtime ensure-backfill bounds missing')
          replacement = '''def _ensure_backfill(
    hass: HomeAssistant,
    entry: ConfigEntry,
    history_storage: Any,
    runtime: dict[str, Any],
    *,
    currency: str,
    settings: dict[str, Any],
) -> None:
    """Leave backfill lifecycle exclusively to config-entry setup.

    Market-assessment reads must never create a second long-running task. The
    config entry owns exactly one background task and cancels it on unload.
    """
    del hass, entry, history_storage, runtime, currency, settings
'''
          rt = rt[:start] + replacement + rt[end:]
          runtime_path.write_text(rt, encoding='utf-8')

          backfill = comp / 'market_assessment_backfill.py'
          bf = backfill.read_text(encoding='utf-8')
          start = bf.find('async def async_market_assessment_backfill_loop(\n')
          if start < 0:
              raise SystemExit('backfill public loop missing')
          new_tail = '''async def async_market_assessment_backfill_loop(
    hass: HomeAssistant,
    entry: ConfigEntry,
    history_store: BitcoinHistoryStore,
    cache: MarketAssessmentIntradayCache,
) -> None:
    """Run the single config-entry-owned background reconstruction worker."""
    await _background_worker(hass, entry, history_store, cache)
'''
          bf = bf[:start] + new_tail
          backfill.write_text(bf, encoding='utf-8')

          test_path = root / 'tests' / 'test_xpub_backfill_rating_regressions.py'
          tests = test_path.read_text(encoding='utf-8')
          extra = '''\n\ndef test_backfill_has_single_background_lifecycle_owner():\n    assert 'entry.async_create_background_task(' in INIT\n    assert '"Bitcoin Stack Tracker 90-day market assessment backfill"' in INIT\n    assert 'hass.async_create_task(\\n        async_market_assessment_backfill_loop' not in INIT\n    assert 'Bitcoin Stack Tracker throttled market assessment backfill' not in (COMPONENT / "market_assessment_runtime.py").read_text(encoding="utf-8")\n    assert 'await _background_worker(hass, entry, history_store, cache)' in BACKFILL\n    assert 'waiting_for_home_assistant' in BACKFILL\n    assert 'waiting_for_tor_gateway' in BACKFILL\n'''
          if 'test_backfill_has_single_background_lifecycle_owner' not in tests:
              tests += extra
          test_path.write_text(tests, encoding='utf-8')

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/bitcoin_stack_tracker
          node --check custom_components/bitcoin_stack_tracker/frontend/static/app.js
          node --check custom_components/bitcoin_stack_tracker/frontend/panel.js
          python -m pytest -q tests/test_xpub_backfill_rating_regressions.py tests/test_sentinel_market_regressions.py tests/test_market_assessment_ui.py tests/test_chart_independent_scales.py tests/test_release_features.py
      - name: Commit production fix and remove bootstrap workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-startup-backfill-fix.yml .github/workflows/agent-backfill-retry-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Home Assistant backfill task lifecycle"
          git push origin HEAD:agent/sentinel-market-cache-cleanup

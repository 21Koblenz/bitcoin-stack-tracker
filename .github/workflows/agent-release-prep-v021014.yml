name: Agent prepare v0.21.0.14

on:
  push:
    branches:
      - agent/sentinel-market-cache-cleanup
    paths:
      - .github/workflows/agent-release-prep-v021014.yml

permissions:
  contents: write
  actions: write

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/sentinel-market-cache-cleanup
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Remove obsolete action-required runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 32205345189 32205345167 32205345241; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" || true
          done

      - name: Prepare v0.21.0.14 sources and release notes
        shell: python
        run: |
          from pathlib import Path

          old = "0.21.0.13"
          new = "0.21.0.14"
          root = Path('.')
          version_files = [
              root / 'VERSION.txt',
              root / 'README.md',
              root / 'custom_components/bitcoin_stack_tracker/manifest.json',
              root / 'custom_components/bitcoin_stack_tracker/const.py',
              root / 'custom_components/bitcoin_stack_tracker/wallet_watch.py',
              root / 'custom_components/bitcoin_stack_tracker/frontend/index.html',
              root / 'custom_components/bitcoin_stack_tracker/frontend/panel.js',
              root / 'custom_components/bitcoin_stack_tracker/frontend/static/app.js',
          ]
          for path in version_files:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected {old} in {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          const_path = root / 'custom_components/bitcoin_stack_tracker/const.py'
          const = const_path.read_text(encoding='utf-8')
          if 'FRONTEND_CACHE_REVISION = "7"' in const:
              const = const.replace('FRONTEND_CACHE_REVISION = "7"', 'FRONTEND_CACHE_REVISION = "8"', 1)
          elif 'FRONTEND_CACHE_REVISION = "8"' not in const:
              raise SystemExit('unexpected frontend cache revision')
          const_path.write_text(const, encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'existing five-minute current-score run, are not interpolated, and are retained for up to 45 days',
              'existing 15-minute current-score run, are not interpolated, and are retained for up to 90 days',
          )
          readme = readme.replace(
              'bestehenden 5-Minuten-Current-Score-Berechnung, werden nicht interpoliert und bis zu 45 Tage gespeichert',
              'bestehenden 15-Minuten-Current-Score-Berechnung, werden nicht interpoliert und bis zu 90 Tage gespeichert',
          )

          english_start = readme.index('### Release\n', readme.index('<a id="english">'))
          english_end = readme.index('### What this project explicitly is not', english_start)
          english_release = '''### Release\n\nCurrent project version: **v0.21.0.14**. This release makes the 90-day market-assessment reconstruction startup-safe, moves live/reconstructed score buckets to 15 minutes, fixes Sats Sentinel privacy after inactivity auto-lock, and completes the repository/performance cleanup.\n\n#### Highlights since v0.21.0.13\n\n- **Startup-safe 90-day reconstruction:** exactly one detached background worker; Home Assistant startup and shutdown are never owned by the long-running backfill.\n- **15-minute market assessment:** 8,640 buckets across 90 days. Existing local 15-minute/legacy 5-minute/adaptive price caches are reused first; missing public candles are fetched only through Tor, Coinbase Exchange first with Bitstamp fallback.\n- **Fail-closed Tor routing:** no clearnet fallback for public reconstruction requests.\n- **Sats Sentinel auto-lock privacy:** when locked-screen Sentinel display is disabled, inactivity auto-lock now hides and clears the locked watch-only card exactly like an explicit Lock action. Background monitoring and alerts continue.\n- **Accurate reconstruction diagnostics:** the UI shows the actual backend source, 15-minute interval, route, live/backfilled counts and remaining points instead of a hard-coded `Bitstamp 5m` label.\n- **Market labels and charts:** all seven rating labels are editable display text; independent chart axes retain signed SymLog support while the market score remains linear.\n- **Performance:** one-shot CI smoke on 3,650 days of model history measured market-score p95 **147.11 ms**. With 20,000 chart points and 1,500 events, max-drawdown p95 was **15.94 ms** and TWR p95 **36.64 ms**. The focused regression/performance suite passed **28/28**.\n- **Repository cleanup:** temporary implementation workflows and duplicate historical release/QC files are removed; dependency security, HACS/hassfest validation and Tor Gateway builds remain part of CI.\n\n**After updating, fully restart Home Assistant Core and hard-reload the frontend.**\n\nThe **Tor Gateway remains at v0.21.0.3**.\n\nRelease changes: [`CHANGELOG.md`](CHANGELOG.md)\n\n'''
          readme = readme[:english_start] + english_release + readme[english_end:]

          german_start = readme.index('### Release\n', readme.index('<a id="deutsch">'))
          german_end = readme.index('### Was das Projekt ausdrücklich nicht ist', german_start)
          german_release = '''### Release\n\nAktueller Projektstand: **v0.21.0.14**. Dieses Release macht die 90-Tage-Markteinschätzungs-Rückrechnung startup-sicher, stellt Live- und Rückrechnungs-Scores auf 15-Minuten-Buckets um, behebt die Sats-Sentinel-Privatsphäre beim Inaktivitäts-Auto-Lock und schließt die Repository-/Performance-Bereinigung ab.\n\n#### Highlights seit v0.21.0.13\n\n- **Startup-sichere 90-Tage-Rückrechnung:** genau ein entkoppelter Background-Worker; der lange Backfill besitzt weder HA-Startup noch Shutdown.\n- **15-Minuten-Markteinschätzung:** 8.640 Buckets über 90 Tage. Vorhandene lokale 15-Minuten-/alte 5-Minuten-/adaptive Kurscaches werden zuerst verwendet; fehlende öffentliche Candles kommen ausschließlich über Tor, zuerst Coinbase Exchange und danach Bitstamp als Fallback.\n- **Fail-Closed-Tor-Routing:** kein Clearnet-Fallback für öffentliche Rückrechnungsabfragen.\n- **Sats-Sentinel-Auto-Lock-Privatsphäre:** ist die Anzeige auf dem Sperrbildschirm deaktiviert, blendet der Inaktivitäts-Auto-Lock die Watch-only-Karte jetzt genauso konsequent aus und leert sie wie ein aktiver Klick auf „Sperren“. Hintergrundüberwachung und Alarme laufen weiter.\n- **Korrekte Rückrechnungsdiagnose:** die UI zeigt tatsächliche Backend-Quelle, 15-Minuten-Intervall, Route, Live-/Rückrechnungszähler und Restpunkte statt festem `Bitstamp 5m`.\n- **Marktlabels und Charts:** alle sieben Rating-Namen sind frei editierbarer Anzeigetext; unabhängige Chartachsen behalten Signed-SymLog, während der Marktscore linear bleibt.\n- **Performance:** One-shot-CI-Smoke mit 3.650 Tagen Modellhistorie: Market-Score p95 **147,11 ms**. Bei 20.000 Chartpunkten und 1.500 Events: Max-Drawdown p95 **15,94 ms**, TWR p95 **36,64 ms**. Die fokussierte Regression-/Performance-Suite bestand **28/28**.\n- **Repository-Bereinigung:** temporäre Implementierungs-Workflows und doppelte alte Release-/QC-Dateien sind entfernt; Dependency-Security, HACS-/hassfest-Validierung und Tor-Gateway-Build bleiben im CI.\n\n**Nach dem Update Home Assistant Core vollständig neu starten und das Frontend hart neu laden.**\n\nDas **Tor Gateway bleibt v0.21.0.3**.\n\nÄnderungen dieses Releases: [`CHANGELOG.md`](CHANGELOG.md)\n\n'''
          readme = readme[:german_start] + german_release + readme[german_end:]
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          if '## v0.21.0.14 ' not in changelog:
              entry = '''## v0.21.0.14 — 2026-08-19: startup-safe market reconstruction, Sentinel privacy & smoother runtime\n\n### English\n\n#### Fixed\n- Fixed the Home Assistant restart/startup failure introduced by the long-running market reconstruction. Market reads no longer spawn a second backfill owner; reconstruction is a single detached background worker and cannot block Core startup completion.\n- Fixed the 90-day reconstruction remaining at `waiting_for_home_assistant` on otherwise running installations. The worker now uses a bounded startup delay and then proceeds independently.\n- Fixed Sats Sentinel still appearing on the locked screen after inactivity auto-lock when locked-screen display was disabled. Manual lock, auto-lock and foreground/session reconciliation now share the same fail-closed hide path.\n- Removed the stale hard-coded `Bitstamp 5m` reconstruction label. Status now reports the actual backend source, interval and Tor route.\n\n#### Market assessment / performance\n- Live and reconstructed market-assessment snapshots now use **15-minute buckets** with **90-day retention**: 8,640 target buckets instead of 25,920 five-minute buckets.\n- Reconstruction reuses existing local 15-minute candles first, then compacts legacy five-minute candles and reuses adaptive local price samples before any network request.\n- Missing public history remains Tor-only/fail-closed. Coinbase Exchange 15-minute candles are preferred; Bitstamp remains the Tor-routed fallback.\n- Reconstructed points are explicitly marked and never overwrite a real live observation in the same bucket.\n- One-shot performance smoke: **28/28** focused tests passed; market-score p95 **147.11 ms** on 3,650 history days; max-drawdown p95 **15.94 ms** and TWR p95 **36.64 ms** on 20,000 chart points / 1,500 events.\n- Backfill CPU work remains deliberately paced at two score points per batch with a 20-second pause and runs in an executor.\n\n#### UI / model / repository\n- Seven market-rating names are editable display text and excluded from score/cache signatures.\n- Independent chart axes retain signed SymLog for signed P/L while the market score remains fixed linear 0–100.\n- Removed temporary implementation workflows and duplicate historical release/QC files; `CHANGELOG.md` remains the release-history source of truth.\n- Custom Integration: **v0.21.0.14**. Tor Gateway: **v0.21.0.3 unchanged**.\n\n### Deutsch\n\n#### Behoben\n- Home-Assistant-Restart-/Startup-Fehler durch die lange Marktrückrechnung behoben. Market-Reads starten keinen zweiten Backfill mehr; die Rückrechnung besitzt genau einen entkoppelten Background-Worker und blockiert Core-Startup nicht.\n- Zustand `waiting_for_home_assistant` auf bereits laufenden Installationen behoben. Nach einer begrenzten Startup-Verzögerung arbeitet der Worker unabhängig weiter.\n- Sats Sentinel blieb nach Inaktivitäts-Auto-Lock trotz deaktivierter Sperrbildschirm-Anzeige sichtbar. Manueller Lock, Auto-Lock und Session-/Foreground-Abgleich verwenden jetzt denselben fail-closed Hide-Pfad.\n- Fest verdrahtete Anzeige `Bitstamp 5m` entfernt. Der Status zeigt echte Backend-Quelle, Intervall und Tor-Route.\n\n#### Markteinschätzung / Performance\n- Live- und rückgerechnete Markteinschätzung nutzt jetzt **15-Minuten-Buckets** mit **90 Tagen Aufbewahrung**: 8.640 Ziel-Buckets statt 25.920 Fünf-Minuten-Buckets.\n- Vor Netzwerkzugriff werden lokale 15-Minuten-Candles verwendet, alte 5-Minuten-Candles lokal verdichtet und adaptive lokale Kurssamples wiederverwendet.\n- Fehlende öffentliche Historie bleibt Tor-only/fail-closed. Coinbase-Exchange-15-Minuten-Candles zuerst, Bitstamp als Tor-Fallback.\n- Rückgerechnete Punkte sind gekennzeichnet und überschreiben niemals einen echten Live-Punkt desselben Buckets.\n- One-shot-Performance-Smoke: **28/28** fokussierte Tests bestanden; Market-Score p95 **147,11 ms** bei 3.650 Historientagen; Max-Drawdown p95 **15,94 ms** und TWR p95 **36,64 ms** bei 20.000 Chartpunkten / 1.500 Events.\n- Backfill bleibt bewusst auf zwei Scorepunkte pro Batch plus 20 Sekunden Pause gedrosselt und läuft im Executor.\n\n#### UI / Modell / Repository\n- Sieben Market-Rating-Namen sind frei editierbarer Anzeigetext und werden nicht in Score-/Cache-Signaturen einbezogen.\n- Unabhängige Chartachsen behalten Signed-SymLog für vorzeichenbehaftetes P/L; der Marktscore bleibt linear 0–100.\n- Temporäre Implementierungs-Workflows und doppelte alte Release-/QC-Dateien entfernt; `CHANGELOG.md` bleibt einzige Release-Historie.\n- Custom Integration: **v0.21.0.14**. Tor Gateway: **v0.21.0.3 unverändert**.\n\n'''
              changelog = changelog.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
              changelog_path.write_text(changelog, encoding='utf-8')

      - name: Validate release candidate
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8,<10'
          python -m compileall -q custom_components/bitcoin_stack_tracker
          node --check custom_components/bitcoin_stack_tracker/frontend/static/app.js
          node --check custom_components/bitcoin_stack_tracker/frontend/panel.js
          node tests/performance_math_test.js
          pytest -q \
            tests/test_market_backfill_lifecycle.py \
            tests/test_sentinel_autolock_visibility.py \
            tests/test_xpub_backfill_rating_regressions.py \
            tests/test_chart_independent_scales.py \
            tests/test_release_features.py \
            tests/test_github_release_surface.py \
            tests/test_buy_opportunity.py
          test "$(tr -d '[:space:]' < VERSION.txt)" = "0.21.0.14"
          grep -q '"version": "0.21.0.14"' custom_components/bitcoin_stack_tracker/manifest.json
          grep -q 'VERSION = "0.21.0.14"' custom_components/bitcoin_stack_tracker/const.py
          grep -q 'FRONTEND_BUILD = "0.21.0.14"' custom_components/bitcoin_stack_tracker/const.py
          grep -q 'const BUILD_VERSION = "0.21.0.14"' custom_components/bitcoin_stack_tracker/frontend/static/app.js
          grep -q 'const FRONTEND_BUILD = "0.21.0.14"' custom_components/bitcoin_stack_tracker/frontend/panel.js
          grep -q 'v=0.21.0.14' custom_components/bitcoin_stack_tracker/frontend/index.html
          grep -q 'FRONTEND_CACHE_REVISION = "8"' custom_components/bitcoin_stack_tracker/const.py
          test "$(grep -RIl 'agent-performance-smoke\|agent-autolock-backfill-fix\|agent-startup-backfill-fix' .github/workflows || true)" = ""

      - name: Commit release preparation and remove bootstrap workflow
        run: |
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git rm .github/workflows/agent-release-prep-v021014.yml
          git add \
            VERSION.txt README.md CHANGELOG.md \
            custom_components/bitcoin_stack_tracker/manifest.json \
            custom_components/bitcoin_stack_tracker/const.py \
            custom_components/bitcoin_stack_tracker/wallet_watch.py \
            custom_components/bitcoin_stack_tracker/frontend/index.html \
            custom_components/bitcoin_stack_tracker/frontend/panel.js \
            custom_components/bitcoin_stack_tracker/frontend/static/app.js
          git commit -m "Prepare v0.21.0.14 release"
          git push origin HEAD:agent/sentinel-market-cache-cleanup

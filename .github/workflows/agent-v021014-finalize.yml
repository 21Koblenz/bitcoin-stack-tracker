name: Agent v0.21.0.14 finalize

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-v021014-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/sentinel-market-cache-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Finalize release metadata
        shell: python
        run: |
          from pathlib import Path
          root=Path('.')
          old='0.21.0.13'; new='0.21.0.14'
          for rel in ['VERSION.txt','README.md','custom_components/bitcoin_stack_tracker/manifest.json','custom_components/bitcoin_stack_tracker/const.py','custom_components/bitcoin_stack_tracker/wallet_watch.py','custom_components/bitcoin_stack_tracker/frontend/index.html','custom_components/bitcoin_stack_tracker/frontend/panel.js','custom_components/bitcoin_stack_tracker/frontend/static/app.js']:
              p=root/rel; s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'{old} missing in {rel}')
              p.write_text(s.replace(old,new),encoding='utf-8')
          p=root/'custom_components/bitcoin_stack_tracker/const.py'; s=p.read_text(encoding='utf-8').replace('FRONTEND_CACHE_REVISION = "7"','FRONTEND_CACHE_REVISION = "8"',1); p.write_text(s,encoding='utf-8')
          p=root/'README.md'; s=p.read_text(encoding='utf-8')
          s=s.replace('existing five-minute current-score run, are not interpolated, and are retained for up to 45 days','existing 15-minute current-score run, are not interpolated, and are retained for up to 90 days')
          s=s.replace('bestehenden 5-Minuten-Current-Score-Berechnung, werden nicht interpoliert und bis zu 45 Tage gespeichert','bestehenden 15-Minuten-Current-Score-Berechnung, werden nicht interpoliert und bis zu 90 Tage gespeichert')
          a=s.index('### Release\n',s.index('<a id="english">')); b=s.index('### What this project explicitly is not',a)
          en='''### Release\n\nCurrent project version: **v0.21.0.14**. This release makes the 90-day market-assessment reconstruction startup-safe, moves live/reconstructed scores to 15-minute buckets, fixes Sats Sentinel privacy after inactivity auto-lock and completes the performance/repository cleanup.\n\n#### Highlights since v0.21.0.13\n\n- one detached startup-safe reconstruction worker; market reads never start a second long-running backfill\n- 15-minute score buckets, 90-day retention and 8,640 target points\n- existing local 15-minute, legacy 5-minute and adaptive price caches are reused before any network request\n- missing public history is Tor-only/fail-closed; Coinbase Exchange first, Bitstamp fallback\n- locked-screen Sentinel remains hidden after inactivity auto-lock when the display option is disabled; monitoring and alerts continue\n- reconstruction status reports the real source, 15-minute interval and Tor route\n- one-shot performance smoke passed 28/28 focused tests: market-score p95 147.11 ms on 3,650 history days; max-drawdown p95 15.94 ms and TWR p95 36.64 ms on 20,000 chart points / 1,500 events\n\n**After updating, fully restart Home Assistant Core and hard-reload the frontend.**\n\nThe **Tor Gateway remains at v0.21.0.3**.\n\nRelease changes: [`CHANGELOG.md`](CHANGELOG.md)\n\n'''
          s=s[:a]+en+s[b:]
          a=s.index('### Release\n',s.index('<a id="deutsch">')); b=s.index('### Was das Projekt ausdrücklich nicht ist',a)
          de='''### Release\n\nAktueller Projektstand: **v0.21.0.14**. Dieses Release macht die 90-Tage-Markteinschätzungs-Rückrechnung startup-sicher, stellt Live-/Rückrechnungs-Scores auf 15-Minuten-Buckets um, behebt die Sats-Sentinel-Privatsphäre beim Inaktivitäts-Auto-Lock und schließt die Performance-/Repository-Bereinigung ab.\n\n#### Highlights seit v0.21.0.13\n\n- genau ein entkoppelter startup-sicherer Rückrechnungs-Worker; Market-Reads starten keinen zweiten Langzeit-Backfill\n- 15-Minuten-Score-Buckets, 90 Tage Aufbewahrung und 8.640 Zielpunkte\n- lokale 15-Minuten-, alte 5-Minuten- und adaptive Kurscaches werden vor jeder Netzwerkabfrage wiederverwendet\n- fehlende öffentliche Historie bleibt Tor-only/fail-closed; Coinbase Exchange zuerst, Bitstamp als Fallback\n- Sats Sentinel bleibt nach Inaktivitäts-Auto-Lock auf dem Sperrbildschirm verborgen, wenn die Anzeige deaktiviert ist; Überwachung und Alarme laufen weiter\n- Rückrechnungsstatus zeigt echte Quelle, 15-Minuten-Intervall und Tor-Route\n- One-shot-Performance-Smoke bestand 28/28 fokussierte Tests: Market-Score p95 147,11 ms bei 3.650 Historientagen; Max-Drawdown p95 15,94 ms und TWR p95 36,64 ms bei 20.000 Chartpunkten / 1.500 Events\n\n**Nach dem Update Home Assistant Core vollständig neu starten und das Frontend hart neu laden.**\n\nDas **Tor Gateway bleibt v0.21.0.3**.\n\nÄnderungen dieses Releases: [`CHANGELOG.md`](CHANGELOG.md)\n\n'''
          p.write_text(s[:a]+de+s[b:],encoding='utf-8')
          p=root/'CHANGELOG.md'; s=p.read_text(encoding='utf-8')
          entry='''## v0.21.0.14 — 2026-08-19: startup-safe market reconstruction, Sentinel privacy & smoother runtime\n\n### English\n- Fixed the Home Assistant restart/startup failure from duplicate long-running market backfill ownership; reconstruction now has one detached background worker.\n- Live and reconstructed market assessment now uses 15-minute buckets with 90-day retention (8,640 target buckets). Local cached intraday prices are reused before Tor-only Coinbase/Bitstamp fallback requests.\n- Fixed Sats Sentinel remaining visible after inactivity auto-lock when locked-screen display is disabled.\n- Reconstruction diagnostics now show actual backend source, interval and Tor route instead of hard-coded `Bitstamp 5m`.\n- Performance smoke: 28/28 focused tests; market-score p95 147.11 ms, max-drawdown p95 15.94 ms, TWR p95 36.64 ms.\n- Custom Integration: **v0.21.0.14**. Tor Gateway: **v0.21.0.3 unchanged**.\n\n### Deutsch\n- Home-Assistant-Restart-/Startup-Fehler durch doppelte Langzeit-Backfill-Verantwortung behoben; die Rückrechnung besitzt genau einen entkoppelten Background-Worker.\n- Live- und rückgerechnete Markteinschätzung nutzt 15-Minuten-Buckets mit 90 Tagen Aufbewahrung (8.640 Ziel-Buckets). Lokale Intraday-Kurscaches werden vor Tor-only Coinbase-/Bitstamp-Fallbacks genutzt.\n- Sats Sentinel bleibt nach Inaktivitäts-Auto-Lock verborgen, wenn die Sperrbildschirm-Anzeige deaktiviert ist.\n- Rückrechnungsdiagnose zeigt echte Backend-Quelle, Intervall und Tor-Route statt festem `Bitstamp 5m`.\n- Performance-Smoke: 28/28 fokussierte Tests; Market-Score p95 147,11 ms, Max-Drawdown p95 15,94 ms, TWR p95 36,64 ms.\n- Custom Integration: **v0.21.0.14**. Tor Gateway: **v0.21.0.3 unverändert**.\n\n'''
          if '## v0.21.0.14 ' not in s: p.write_text(s.replace('# Changelog\n\n','# Changelog\n\n'+entry,1),encoding='utf-8')
      - name: Validate candidate
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8,<10'
          python -m compileall -q custom_components/bitcoin_stack_tracker
          node --check custom_components/bitcoin_stack_tracker/frontend/static/app.js
          node --check custom_components/bitcoin_stack_tracker/frontend/panel.js
          node tests/performance_math_test.js
          pytest -q tests/test_market_backfill_lifecycle.py tests/test_sentinel_autolock_visibility.py tests/test_xpub_backfill_rating_regressions.py tests/test_chart_independent_scales.py tests/test_release_features.py tests/test_github_release_surface.py tests/test_buy_opportunity.py
          test "$(tr -d '[:space:]' < VERSION.txt)" = "0.21.0.14"
          grep -q '"version": "0.21.0.14"' custom_components/bitcoin_stack_tracker/manifest.json
          grep -q 'VERSION = "0.21.0.14"' custom_components/bitcoin_stack_tracker/const.py
          grep -q 'FRONTEND_BUILD = "0.21.0.14"' custom_components/bitcoin_stack_tracker/const.py
          grep -q 'const BUILD_VERSION = "0.21.0.14"' custom_components/bitcoin_stack_tracker/frontend/static/app.js
          grep -q 'const FRONTEND_BUILD = "0.21.0.14"' custom_components/bitcoin_stack_tracker/frontend/panel.js
          grep -q 'v=0.21.0.14' custom_components/bitcoin_stack_tracker/frontend/index.html
          grep -q 'FRONTEND_CACHE_REVISION = "8"' custom_components/bitcoin_stack_tracker/const.py
      - name: Commit finalized release candidate
        run: |
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git rm -f .github/workflows/agent-v021014-finalize.yml .github/workflows/agent-release-prep-v021014-fixed.yml
          git add VERSION.txt README.md CHANGELOG.md custom_components/bitcoin_stack_tracker/manifest.json custom_components/bitcoin_stack_tracker/const.py custom_components/bitcoin_stack_tracker/wallet_watch.py custom_components/bitcoin_stack_tracker/frontend/index.html custom_components/bitcoin_stack_tracker/frontend/panel.js custom_components/bitcoin_stack_tracker/frontend/static/app.js
          git commit -m "Prepare v0.21.0.14 release"
          git push origin HEAD:agent/sentinel-market-cache-cleanup

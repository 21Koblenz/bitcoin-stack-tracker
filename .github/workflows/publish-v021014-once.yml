name: Publish v0.21.0.14 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v021014-once.yml

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify release target
        env:
          TARGET_SHA: dedde81595e502cf5643c29dda42aae52975bfc3
        run: |
          set -euo pipefail
          test "$(git show "${TARGET_SHA}:VERSION.txt" | tr -d '[:space:]')" = "0.21.0.14"
          test "$(git show "${TARGET_SHA}:custom_components/bitcoin_stack_tracker/manifest.json" | grep -c '"version": "0.21.0.14"')" = "1"
          if git rev-parse -q --verify refs/tags/v0.21.0.14 >/dev/null; then
            echo "v0.21.0.14 already exists" >&2
            exit 1
          fi
      - name: Remove obsolete failed workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for run_id in \
            32208568932 \
            32208677350 \
            32208677379 \
            32208799981 \
            32208799999 \
            32208799941; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" || true
          done
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: dedde81595e502cf5643c29dda42aae52975bfc3
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## Bitcoin Stack Tracker v0.21.0.14

          ### Deutsch
          - Home-Assistant-Startup-/Restart-Problem der Marktrückrechnung behoben: genau ein entkoppelter Background-Worker, kein zweiter Langzeit-Task aus Market-Reads.
          - Markteinschätzung auf **15-Minuten-Buckets** mit **90 Tagen Aufbewahrung** und **8.640 Zielpunkten** umgestellt.
          - Vor öffentlichen Abfragen werden lokale 15-Minuten-, alte 5-Minuten- und adaptive Kurscaches wiederverwendet.
          - Fehlende öffentliche Historie bleibt **Tor-only / fail-closed**: Coinbase Exchange zuerst, Bitstamp als Fallback.
          - Sats Sentinel bleibt nach Inaktivitäts-Auto-Lock verborgen, wenn die Anzeige auf dem Sperrbildschirm deaktiviert ist; Überwachung und Alarme laufen weiter.
          - Rückrechnungsstatus zeigt echte Quelle, 15-Minuten-Intervall und Tor-Route statt festem `Bitstamp 5m`.
          - Performance-Smoke: **28/28** fokussierte Tests; Market-Score p95 **147,11 ms**, Max-Drawdown p95 **15,94 ms**, TWR p95 **36,64 ms**.
          - Editierbare Market-Rating-Namen, unabhängige Signed-SymLog-Chartachsen und die weiteren Sentinel-/Chart-/Repository-Fixes aus dem Release-PR sind enthalten.
          - Tor Gateway bleibt **v0.21.0.3**.

          ### English
          - Fixed the Home Assistant startup/restart issue in market reconstruction: one detached background worker, no second long-running task from market reads.
          - Market assessment now uses **15-minute buckets**, **90-day retention**, and **8,640 target points**.
          - Local 15-minute, legacy 5-minute and adaptive price caches are reused before public requests.
          - Missing public history stays **Tor-only / fail-closed**: Coinbase Exchange first, Bitstamp fallback.
          - Sats Sentinel remains hidden after inactivity auto-lock when locked-screen display is disabled; monitoring and alerts continue.
          - Reconstruction diagnostics show the real source, 15-minute interval and Tor route instead of hard-coded `Bitstamp 5m`.
          - Performance smoke: **28/28** focused tests; market-score p95 **147.11 ms**, max-drawdown p95 **15.94 ms**, TWR p95 **36.64 ms**.
          - Editable market-rating labels, independent signed SymLog chart axes and the remaining Sentinel/chart/repository fixes from the release PR are included.
          - Tor Gateway remains **v0.21.0.3**.

          **Nach dem Update / after updating:** Home Assistant Core vollständig neu starten und das Frontend hart neu laden / fully restart Home Assistant Core and hard-reload the frontend.
          EOF

          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git tag -a v0.21.0.14 "${TARGET_SHA}" -m "v0.21.0.14"
          git push origin refs/tags/v0.21.0.14
          gh release create v0.21.0.14 --verify-tag --target "${TARGET_SHA}" --title "v0.21.0.14" --notes-file /tmp/release-notes.md
      - name: Build and upload release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: dedde81595e502cf5643c29dda42aae52975bfc3
        run: |
          set -euo pipefail
          archive="bitcoin-stack-tracker-v0.21.0.14.zip"
          git archive --format=zip --prefix=bitcoin-stack-tracker-v0.21.0.14/ -o "${archive}" "${TARGET_SHA}"
          sha256sum "${archive}" > "${archive}.sha256"
          gh release upload v0.21.0.14 "${archive}" "${archive}.sha256" --clobber

name: Agent Sentinel auto-lock and reconstruction fix

on:
  push:
    branches:
      - agent/sentinel-market-cache-cleanup
    paths:
      - .github/workflows/agent-autolock-backfill-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/sentinel-market-cache-cleanup
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10'

      - name: Patch auto-lock UI and 15-minute reconstruction
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          comp = root / 'custom_components' / 'bitcoin_stack_tracker'

          # 1) Backfill: do not wait on CoreState identity. This is already a
          # detached HA background task; use one bounded startup delay instead.
          backfill_path = comp / 'market_assessment_backfill.py'
          backfill = backfill_path.read_text(encoding='utf-8')
          backfill = backfill.replace(
              'from homeassistant.core import CoreState, HomeAssistant',
              'from homeassistant.core import HomeAssistant',
              1,
          )

          old_gate = '''    while _runtime(hass, entry.entry_id) is not None and hass.state is not CoreState.running:\n        _set_status(\n            hass,\n            entry.entry_id,\n            state="waiting_for_home_assistant",\n            complete=False,\n            error=None,\n        )\n        if not await _sleep_while_loaded(hass, entry.entry_id, 2):\n            return\n\n    if not await _sleep_while_loaded(hass, entry.entry_id, BACKFILL_INITIAL_DELAY_SECONDS):\n        return\n'''
          new_gate = '''    # The worker is already detached into Home Assistant's background-task pool.\n    # Never gate it on CoreState: on some installations that left the worker\n    # permanently reporting waiting_for_home_assistant even though HA was usable.\n    # A bounded delay is enough to keep reconstruction out of the startup hot path.\n    _set_status(\n        hass,\n        entry.entry_id,\n        state="startup_delay",\n        complete=False,\n        interval_minutes=BACKFILL_INTERVAL_MINUTES,\n        retention_days=BACKFILL_DAYS,\n        network_route="Tor only",\n        retry_in_seconds=BACKFILL_INITIAL_DELAY_SECONDS,\n        next_retry_at=(\n            datetime.now(timezone.utc)\n            + timedelta(seconds=BACKFILL_INITIAL_DELAY_SECONDS)\n        ).isoformat(),\n        error=None,\n    )\n    if not await _sleep_while_loaded(hass, entry.entry_id, BACKFILL_INITIAL_DELAY_SECONDS):\n        return\n'''
          if old_gate not in backfill:
              raise SystemExit('backfill CoreState gate pattern missing')
          backfill = backfill.replace(old_gate, new_gate, 1)

          # Reuse every suitable local intraday cache before a Tor provider.
          # Exact 15m market candles win, then legacy 5m candles, then adaptive
          # local price samples. Daily closes are deliberately not fabricated
          # into intraday points.
          start = backfill.index('def _cached_market_candles(\n')
          end = backfill.index('\n\nasync def _download_coinbase_90d(', start)
          cached_func = '''def _cached_market_candles(\n    history_store: BitcoinHistoryStore,\n    *,\n    currency: str,\n    now: datetime,\n    cutoff: datetime,\n) -> dict[str, float]:\n    """Reuse durable local intraday prices before making a public request.\n\n    Exact 15-minute exchange candles have the highest priority. Existing\n    five-minute candles from older builds are compacted to the 15-minute grid.\n    The adaptive local multi-provider ``price_samples`` cache is also reused.\n    Nothing in this function performs network I/O.\n    """\n    by_bucket: dict[str, tuple[int, datetime, float]] = {}\n\n    def merge(values: Mapping[str, Any], *, priority: int) -> None:\n        for raw_stamp, raw_price in values.items():\n            stamp = _utc_stamp(raw_stamp)\n            try:\n                price = float(raw_price)\n            except (TypeError, ValueError):\n                continue\n            if stamp is None or price <= 0 or not (cutoff <= stamp <= now):\n                continue\n            bucket = _bucket(stamp)\n            previous = by_bucket.get(bucket)\n            if (\n                previous is None\n                or priority > previous[0]\n                or (priority == previous[0] and stamp >= previous[1])\n            ):\n                by_bucket[bucket] = (priority, stamp, price)\n\n    try:\n        adaptive = history_store.price_samples_for_days(BACKFILL_DAYS).get(currency, {})\n    except (AttributeError, TypeError, ValueError):\n        adaptive = {}\n    if isinstance(adaptive, Mapping):\n        merge(adaptive, priority=0)\n\n    for interval, priority in ((5, 1), (BACKFILL_INTERVAL_MINUTES, 2)):\n        try:\n            values = history_store.market_candles_for_days(BACKFILL_DAYS, interval).get(\n                currency, {}\n            )\n        except (AttributeError, TypeError, ValueError):\n            continue\n        if isinstance(values, Mapping):\n            merge(values, priority=priority)\n\n    return {stamp.isoformat(): price for _priority, stamp, price in by_bucket.values()}\n'''
          backfill = backfill[:start] + cached_func + backfill[end:]
          backfill_path.write_text(backfill, encoding='utf-8')

          # 2) Frontend: reconcile Core-side inactivity locking when a suspended
          # tab becomes visible, and make hiding Sentinel one idempotent path.
          app_path = comp / 'frontend' / 'static' / 'app.js'
          app = app_path.read_text(encoding='utf-8')

          marker = 'function setWalletWatchShowWhenLocked(show){'
          if marker not in app:
              raise SystemExit('Sentinel locked display setter missing')
          helper = '''function hideLockedWalletWatch(){\n  state.lockedWalletWatchEditId="";\n  state.lockedWalletWatchSaving=false;\n  state.walletWatch=null;\n  state.walletWatchTxOverviews={};\n  const host=$("#lockedWalletWatch");\n  if(host){host.classList.add("hidden");host.innerHTML="";}\n}\n'''
          if 'function hideLockedWalletWatch(){' not in app:
              app = app.replace(marker, helper + marker, 1)

          app = app.replace(
              'if(!enabled){state.walletWatch=null;const host=$("#lockedWalletWatch");if(host){host.classList.add("hidden");host.innerHTML="";}}',
              'if(!enabled){hideLockedWalletWatch();}',
              1,
          )

          old_locked = '''    state.lockedWalletWatchEditId="";\n    state.walletWatch=null;\n    const showLockedSentinel=walletWatchShowWhenLocked();\n    if(showLockedSentinel){'''
          new_locked = '''    hideLockedWalletWatch();\n    const showLockedSentinel=walletWatchShowWhenLocked();\n    if(showLockedSentinel){'''
          if old_locked not in app:
              raise SystemExit('locked loadData Sentinel pattern missing')
          app = app.replace(old_locked, new_locked, 1)

          old_autolock = '''  autoLockInFlight=true;\n  try{\n    await service("lock_vault",{config_entry_id:state.entryId});\n    toast(t("autoLockTriggered"));\n    state.lastActivityAt=Date.now();\n    await loadData();'''
          new_autolock = '''  autoLockInFlight=true;\n  try{\n    if(!walletWatchShowWhenLocked())hideLockedWalletWatch();\n    await service("lock_vault",{config_entry_id:state.entryId});\n    toast(t("autoLockTriggered"));\n    state.lastActivityAt=Date.now();\n    await loadData();\n    if(!walletWatchShowWhenLocked())hideLockedWalletWatch();'''
          if old_autolock not in app:
              raise SystemExit('performAutoLock pattern missing')
          app = app.replace(old_autolock, new_autolock, 1)

          old_visibility = '''document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state.entryId){void refreshNetworkStatus({silent:true});if(state.activeTab==="settings")void refreshConnectionInventory({silent:true});}});'''
          new_visibility = '''document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state.entryId){void loadData().then(()=>{if(state.data?.locked&&!walletWatchShowWhenLocked())hideLockedWalletWatch();void refreshNetworkStatus({silent:true});if(state.activeTab==="settings")void refreshConnectionInventory({silent:true});}).catch(error=>console.warn("Bitcoin Stack foreground state refresh failed",errorText(error)));}});'''
          if old_visibility not in app:
              raise SystemExit('visibilitychange pattern missing')
          app = app.replace(old_visibility, new_visibility, 1)

          # Dynamic reconstruction diagnostics: no stale hard-coded Bitstamp 5m.
          status_start = app.index('function renderMarketAssessmentBackfillStatus(')
          status_end = app.index('\nfunction renderMarketAssessmentHistory()', status_start)
          new_status = '''function renderMarketAssessmentBackfillStatus(payload=state.marketAssessmentHistory){\n  const host=$("#marketAssessmentBackfillStatus");if(!host)return;const s=payload?.intraday_backfill||{};\n  if(!Object.keys(s).length){host.textContent=walletWatchLang("90-Tage-Rückrechnung wartet auf Start …","90-day reconstruction waiting to start …");return;}\n  const cached=Number(s.cached_points||0),live=Number(s.live_points||0),backfilled=Number(s.backfilled_points||0),sourcePoints=Number(s.source_points||0),available=Number(s.available_price_points||0),done=Number(s.completed_points||cached),target=Number(s.expected_source_points||s.expected_full_grid_points||8640),pct=target>0?Math.max(0,Math.min(100,done/target*100)):0,complete=Boolean(s.complete),remaining=Math.max(0,Number(s.remaining_points??(target-done))),interval=Math.max(1,Number(s.interval_minutes||15)),source=String(s.source||walletWatchLang("lokaler Kurscache / Tor-Anbieter","local price cache / Tor provider")),route=String(s.network_route||"Tor only"),stateLabel=complete?walletWatchLang("vollständig","complete"):String(s.state||walletWatchLang("läuft gedrosselt","throttled")),availableLabel=available>0?` · ${walletWatchLang("Kurse verfügbar","prices available")} ${fmtNumber(available,0)}`:"";\n  host.textContent=walletWatchLang(`${complete?"✓":"⏳"} 90-Tage-Rückrechnung: ${fmtNumber(done,0)} / ${fmtNumber(target,0)} · ${fmtNumber(pct,1)} % · ${stateLabel} · Cache ${fmtNumber(cached,0)} (live ${fmtNumber(live,0)} / rückgerechnet ${fmtNumber(backfilled,0)})${availableLabel} · ${source} · ${fmtNumber(interval,0)} min · ${route}${remaining?` · verbleibend ${fmtNumber(remaining,0)}`:""}`,`${complete?"✓":"⏳"} 90-day reconstruction: ${fmtNumber(done,0)} / ${fmtNumber(target,0)} · ${fmtNumber(pct,1)}% · ${stateLabel} · cache ${fmtNumber(cached,0)} (live ${fmtNumber(live,0)} / backfilled ${fmtNumber(backfilled,0)})${availableLabel} · ${source} · ${fmtNumber(interval,0)} min · ${route}${remaining?` · ${fmtNumber(remaining,0)} remaining`:""}`);\n  host.className=`result market-assessment-backfill-status ${complete?"positive":""}`;\n}\n'''
          app = app[:status_start] + new_status + app[status_end:]
          if 'Bitstamp 5m · Tor only' in app:
              raise SystemExit('stale Bitstamp 5m status label remains')
          app_path.write_text(app, encoding='utf-8')

          # 3) Bump frontend cache revision without changing integration release version.
          const_path = comp / 'const.py'
          const = const_path.read_text(encoding='utf-8')
          if 'FRONTEND_CACHE_REVISION = "6"' in const:
              const = const.replace('FRONTEND_CACHE_REVISION = "6"', 'FRONTEND_CACHE_REVISION = "7"', 1)
          elif 'FRONTEND_CACHE_REVISION = "7"' not in const:
              raise SystemExit('unexpected frontend cache revision')
          const_path.write_text(const, encoding='utf-8')

          # 4) Regression tests for both bugs.
          lifecycle_path = root / 'tests' / 'test_market_backfill_lifecycle.py'
          lifecycle = lifecycle_path.read_text(encoding='utf-8')
          lifecycle = lifecycle.replace(
              '    assert "waiting_for_home_assistant" in BACKFILL\n',
              '    assert "waiting_for_home_assistant" not in BACKFILL\n    assert "state=\\"startup_delay\\"" in BACKFILL\n',
              1,
          )
          needle = '    assert "local chart cache" in BACKFILL\n'
          if needle not in lifecycle:
              raise SystemExit('lifecycle local cache assertion missing')
          lifecycle = lifecycle.replace(
              needle,
              needle + '    assert "price_samples_for_days(BACKFILL_DAYS)" in BACKFILL\n',
              1,
          )
          lifecycle_path.write_text(lifecycle, encoding='utf-8')

          regression_path = root / 'tests' / 'test_xpub_backfill_rating_regressions.py'
          regression = regression_path.read_text(encoding='utf-8')
          regression = regression.replace(
              '    assert "Bitstamp 5m" in APP\n',
              '    assert "Bitstamp 5m · Tor only" not in APP\n    assert "interval_minutes" in APP\n    assert "network_route" in APP\n',
              1,
          )
          regression_path.write_text(regression, encoding='utf-8')

          ui_test = root / 'tests' / 'test_sentinel_autolock_visibility.py'
          ui_test.write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nAPP = (ROOT / "custom_components" / "bitcoin_stack_tracker" / "frontend" / "static" / "app.js").read_text(encoding="utf-8")\n\n\ndef test_locked_sentinel_hidden_path_is_shared_by_manual_and_auto_state_refresh():\n    assert "function hideLockedWalletWatch(){" in APP\n    assert "if(!walletWatchShowWhenLocked())hideLockedWalletWatch();" in APP\n    assert 'document.addEventListener("visibilitychange"' in APP\n    assert "void loadData().then" in APP\n    assert "state.data?.locked&&!walletWatchShowWhenLocked()" in APP\n\n\ndef test_reconstruction_status_uses_backend_source_and_interval():\n    assert "Bitstamp 5m · Tor only" not in APP\n    assert "s.interval_minutes||15" in APP\n    assert "s.source||walletWatchLang" in APP\n    assert 's.network_route||"Tor only"' in APP\n''', encoding='utf-8')

      - name: Validate patched sources
        run: |
          python -m compileall -q custom_components/bitcoin_stack_tracker
          node --check custom_components/bitcoin_stack_tracker/frontend/static/app.js
          node --check custom_components/bitcoin_stack_tracker/frontend/panel.js
          pytest -q \
            tests/test_market_backfill_lifecycle.py \
            tests/test_xpub_backfill_rating_regressions.py \
            tests/test_sentinel_autolock_visibility.py

      - name: Commit production fix and remove bootstrap workflow
        run: |
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git rm .github/workflows/agent-autolock-backfill-fix.yml
          git add \
            custom_components/bitcoin_stack_tracker/market_assessment_backfill.py \
            custom_components/bitcoin_stack_tracker/frontend/static/app.js \
            custom_components/bitcoin_stack_tracker/const.py \
            tests/test_market_backfill_lifecycle.py \
            tests/test_xpub_backfill_rating_regressions.py \
            tests/test_sentinel_autolock_visibility.py
          git commit -m "Fix Sentinel auto-lock privacy and start market reconstruction"
          git push origin HEAD:agent/sentinel-market-cache-cleanup

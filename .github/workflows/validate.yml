name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agent_patch:
    name: Apply XPUB/backfill/labels patch
    if: (github.ref == 'refs/heads/agent/sentinel-market-cache-cleanup' || github.head_ref == 'agent/sentinel-market-cache-cleanup') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/sentinel-market-cache-cleanup
          fetch-depth: 0

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          root=Path('.')
          comp=root/'custom_components'/'bitcoin_stack_tracker'
          prepared=Path('.github/workflows/agent-xpub-backfill-labels.yml')
          lines=prepared.read_text(encoding='utf-8').splitlines()
          a=next(i for i,l in enumerate(lines) if l.strip()=='- name: Apply fixes')
          r=next(i for i in range(a+1,len(lines)) if lines[i].strip()=='run: |')
          e=next(i for i in range(r+1,len(lines)) if lines[i].startswith('      - name:'))
          source='\n'.join(l[10:] if l.startswith('          ') else l for l in lines[r+1:e])+'\n'

          # Keep the prepared, already-proven backend/cache/backfill patch, but
          # replace its source-sensitive wallet/frontend parts against HEAD.
          ws=source.find('# ---------- Raw XPUB auto detection ----------')
          we=source.find('# ---------- Wire throttled 90-day backfill + expose completeness ----------',ws)
          fs=source.find('# ---------- Frontend: custom labels',we)
          if min(ws,we,fs)<0: raise SystemExit('prepared patch section bounds missing')
          source=source[:ws]+source[we:fs]
          exec(compile(source,str(prepared)+':backend','exec'),{'__name__':'__main__'})

          # ----- XPUB auto detection -----
          p=comp/'wallet_watch.py'; text=p.read_text(encoding='utf-8')
          pattern=re.compile(r'    async def _resolve_xpub_address_type\(.*?\n    async def _probe_gap_address_used\(',re.S)
          replacement='''    async def _resolve_xpub_address_type(
              self, monitor: dict[str, Any], source: dict[str, Any], *, electrum_client: _ElectrumRPCClient | None
          ) -> tuple[str, bool]:
              """Resolve an ambiguous raw xpub from actual address history.

              Raw xpub serialization does not identify the intended script family.
              Auto probes the standard families and marks a fallback as provisional
              instead of ever presenting an unverified 0-BTC wallet as final.
              """
              requested = str(monitor.get("address_type") or "auto").strip().lower()
              extpub = str(monitor.get("value") or "")
              root = _parse_extpub(extpub)
              if requested != "auto":
                  return requested, True
              if not extpub.lower().startswith("xpub"):
                  return root.script_type, True
              for candidate_index, script_type in enumerate(_XPUB_AUTO_CANDIDATES):
                  addresses: list[str] = []
                  for branch, gap_key in ((0, "receive_count"), (1, "change_count")):
                      configured = max(0, int(monitor.get(gap_key) or 0))
                      if configured <= 0:
                          continue
                      count = min(MAX_DERIVED_PER_BRANCH, max(configured, HD_DISCOVERY_BOOTSTRAP_ADDRESSES))
                      for index in range(count):
                          row = derive_extpub_branch_address(extpub, branch, index, address_type=script_type)
                          addresses.append(str(row["address"]))
                  detected = False
                  if electrum_client is not None:
                      statuses = await self._electrum_calls_chunked(
                          electrum_client,
                          [("blockchain.scripthash.subscribe", [_electrum_scripthash(address)]) for address in addresses],
                          chunk_size=ELECTRUM_STATUS_BATCH_SIZE,
                      )
                      detected = any(status not in {None, ""} for status in statuses)
                  else:
                      for address in addresses:
                          if await self._probe_gap_address_used(source, address):
                              detected = True
                              break
                  if detected:
                      return script_type, True
                  if candidate_index + 1 < len(_XPUB_AUTO_CANDIDATES):
                      await asyncio.sleep(GAP_DISCOVERY_YIELD_SECONDS)
              return "p2wpkh", False

              async def _probe_gap_address_used('''
          text,n=pattern.subn(replacement,text,count=1)
          if n!=1: raise SystemExit(f'xpub resolver replacement count={n}')
          text=text.replace('              async def _probe_gap_address_used(\n        self, source:','    async def _probe_gap_address_used(\n        self, source:',1)

          caller=re.compile(r'(?P<i>[ \t]+)monitor\["_resolved_address_type"\] = await self\._resolve_xpub_address_type\(\n(?P=i)    monitor, source, electrum_client=client\n(?P=i)\)')
          def repl(m):
              i=m.group('i')
              return f'{i}resolved_type, resolved_verified = await self._resolve_xpub_address_type(\n{i}    monitor, source, electrum_client=client\n{i})\n{i}monitor["_resolved_address_type"] = resolved_type\n{i}monitor["_resolved_address_type_verified"] = bool(resolved_verified)'
          text,n=caller.subn(repl,text,count=1)
          if n!=1: raise SystemExit(f'xpub caller replacement count={n}')

          old='''            "resolved_address_type": (
                          str(monitor.get("_resolved_address_type") or monitor.get("address_type") or "auto")
                          if str(monitor.get("kind") or "") == "xpub" else ""
                      ),'''
          if old not in text: raise SystemExit('runtime resolved type block missing')
          text=text.replace(old,old+'''
                      "resolved_address_type_verified": (
                          bool(monitor.get("_resolved_address_type_verified"))
                          if str(monitor.get("kind") or "") == "xpub" else True
                      ),''',1)
          old='''            "last_activity_at", "last_balance_refresh_unix",
                  ):'''
          if old not in text: raise SystemExit('runtime merge block missing')
          text=text.replace(old,'''            "last_activity_at", "last_balance_refresh_unix",
                      "resolved_address_type", "resolved_address_type_verified",
                  ):''',1)

          cat=re.compile(r'        resolved_by_monitor: dict\[str, str\] = \{\}\n.*?                item\["resolved_address_type"\] = resolved_by_monitor\[monitor_id\]',re.S)
          cat_new='''        resolved_by_monitor: dict[str, tuple[str, bool]] = {}
                  for row in rebuilt:
                      if not isinstance(row, dict):
                          continue
                      resolved = str(row.get("resolved_address_type") or "")
                      monitor_id = str(row.get("monitor_id") or "")
                      if monitor_id and resolved in _XPUB_AUTO_CANDIDATES:
                          resolved_by_monitor[monitor_id] = (resolved, bool(row.get("resolved_address_type_verified")))
                  for item in self.runtime_store.data.get("monitor_catalog") or []:
                      if not isinstance(item, dict):
                          continue
                      monitor_id = str(item.get("id") or "")
                      if monitor_id in resolved_by_monitor:
                          resolved, verified = resolved_by_monitor[monitor_id]
                          item["resolved_address_type"] = resolved
                          item["resolved_address_type_verified"] = verified'''
          text,n=cat.subn(cat_new,text,count=1)
          if n!=1: raise SystemExit(f'xpub catalog replacement count={n}')

          old='''                    "utxo_count": 0,
                              "baseline_complete": True,
                          },'''
          if old not in text: raise SystemExit('summary init missing')
          text=text.replace(old,'''                    "utxo_count": 0,
                              "baseline_complete": True,
                              "resolved_address_type": "",
                              "resolved_address_type_verified": False,
                          },''',1)
          old='''            summary["balance_sats"] += int(row.get("balance_sats") or 0)
                      summary["utxo_count"] += int(row.get("utxo_count") or 0)'''
          if old not in text: raise SystemExit('summary update missing')
          text=text.replace(old,old+'''
                      if row.get("resolved_address_type"):
                          summary["resolved_address_type"] = str(row.get("resolved_address_type") or "")
                          summary["resolved_address_type_verified"] = bool(row.get("resolved_address_type_verified"))''',1)
          p.write_text(text,encoding='utf-8')

          # ----- Frontend status + editable rating labels -----
          index=comp/'frontend'/'index.html'; html=index.read_text(encoding='utf-8')
          marker='<div id="marketAssessmentHistoryChart" class="chart market-assessment-history-chart">'
          if marker not in html: raise SystemExit('history chart marker missing')
          html=html.replace(marker,'<div id="marketAssessmentBackfillStatus" class="result market-assessment-backfill-status"></div>\n        '+marker,1)
          preview='<div id="buyOpportunitySettingsPreview" class="result"></div>'
          if preview not in html: raise SystemExit('settings preview marker missing')
          labels='''<div class="analysis-head"><span class="kicker">RATING LABELS</span><h3>Eigene Bezeichnungen</h3></div>
            <p class="storage-note">Nur Anzeigetext. Eigene Namen verändern weder Score noch Rückrechnung.</p>
            <div class="buy-opportunity-threshold-grid buy-opportunity-label-grid">
              <label><span>Sehr hoch bewertet</span><input name="label_very_expensive" type="text" maxlength="120" placeholder="Standard"></label>
              <label><span>Hoch bewertet</span><input name="label_expensive" type="text" maxlength="120" placeholder="Standard"></label>
              <label><span>Neutral</span><input name="label_neutral" type="text" maxlength="120" placeholder="Standard"></label>
              <label><span>Interessant</span><input name="label_interesting" type="text" maxlength="120" placeholder="Standard"></label>
              <label><span>Günstig</span><input name="label_cheap" type="text" maxlength="120" placeholder="Standard"></label>
              <label><span>Sehr günstig</span><input name="label_very_cheap" type="text" maxlength="120" placeholder="Standard"></label>
              <label><span>Extrem günstig</span><input name="label_extreme" type="text" maxlength="120" placeholder="Standard"></label>
            </div>
            '''+preview
          html=html.replace(preview,labels,1)
          html=html.replace('static/style.css?v=0.21.0.13&r=5','static/style.css?v=0.21.0.13&r=6',1)
          html=html.replace('static/app.js?v=0.21.0.13&r=5','static/app.js?v=0.21.0.13&r=6',1)
          index.write_text(html,encoding='utf-8')

          const=comp/'const.py'; c=const.read_text(encoding='utf-8')
          if 'FRONTEND_CACHE_REVISION = "5"' in c: c=c.replace('FRONTEND_CACHE_REVISION = "5"','FRONTEND_CACHE_REVISION = "6"',1)
          const.write_text(c,encoding='utf-8')

          appp=comp/'frontend'/'static'/'app.js'; app=appp.read_text(encoding='utf-8')
          rating=re.compile(r'function buyOpportunityRatingLabel\(rating\)\{.*?\n\}',re.S)
          rating_new='''function buyOpportunityRatingLabel(rating){
            const value=String(rating||"unavailable"),custom=String(state.data?.buy_opportunity_settings?.labels?.[value]||"").trim();
            if(custom)return custom.slice(0,120);
            const key={very_expensive:"ratingVeryExpensive",expensive:"ratingExpensive",neutral:"ratingNeutral",interesting:"ratingInteresting",cheap:"ratingCheap",very_cheap:"ratingVeryCheap",extreme:"ratingExtreme",unavailable:"ratingUnavailable"}[value];
            return t(key||"ratingUnavailable");
          }'''
          app,n=rating.subn(rating_new,app,count=1)
          if n!=1: raise SystemExit('rating function replacement failed')
          old='''function buyOpportunitySettingsDefaults(){return {profile:"balanced",currency:(state.data?.currencies||[])[0]||"EUR",weights:{...BUY_OPPORTUNITY_PRESETS.balanced},signal_weights:structuredClone(BUY_OPPORTUNITY_SIGNAL_DEFAULTS),turning_point_weights:structuredClone(BUY_OPPORTUNITY_TURNING_DEFAULTS),model:{...BUY_OPPORTUNITY_MODEL_DEFAULTS},thresholds:{very_expensive_max:20,expensive_max:35,interesting:50,cheap:65,very_cheap:80,extreme:90}};}'''
          new='''function buyOpportunitySettingsDefaults(){return {profile:"balanced",currency:(state.data?.currencies||[])[0]||"EUR",weights:{...BUY_OPPORTUNITY_PRESETS.balanced},signal_weights:structuredClone(BUY_OPPORTUNITY_SIGNAL_DEFAULTS),turning_point_weights:structuredClone(BUY_OPPORTUNITY_TURNING_DEFAULTS),model:{...BUY_OPPORTUNITY_MODEL_DEFAULTS},thresholds:{very_expensive_max:20,expensive_max:35,interesting:50,cheap:65,very_cheap:80,extreme:90},labels:{very_expensive:"",expensive:"",neutral:"",interesting:"",cheap:"",very_cheap:"",extreme:""}};}'''
          if old not in app: raise SystemExit('defaults function missing')
          app=app.replace(old,new,1)
          loop='''  for(const key of ["very_expensive_max","expensive_max","interesting","cheap","very_cheap","extreme"]){const input=form.elements[`threshold_${key}`];if(input)input.value=String(Number(thresholds[key]??defaults.thresholds[key]));}'''
          if loop not in app: raise SystemExit('threshold render loop missing')
          app=app.replace(loop,loop+'''\n  const labels=settings.labels||defaults.labels;for(const key of ["very_expensive","expensive","neutral","interesting","cheap","very_cheap","extreme"]){const input=form.elements[`label_${key}`];if(input)input.value=String(labels[key]||"");}''',1)
          collect='''  const thresholds=Object.fromEntries(["very_expensive_max","expensive_max","interesting","cheap","very_cheap","extreme"].map(key=>[key,Number(form.elements[`threshold_${key}`].value||0)]));'''
          if collect not in app: raise SystemExit('threshold collect missing')
          app=app.replace(collect,collect+'''\n  const labels=Object.fromEntries(["very_expensive","expensive","neutral","interesting","cheap","very_cheap","extreme"].map(key=>[key,String(form.elements[`label_${key}`]?.value||"").trim().slice(0,120)]));''',1)
          service='''weights,signal_weights,turning_point_weights,model,thresholds});'''
          if service not in app: raise SystemExit('settings service payload missing')
          app=app.replace(service,'weights,signal_weights,turning_point_weights,model,thresholds,labels});',1)
          summary='''return {addresses:Number(aggregate.address_count||0),receive_addresses:Number(aggregate.receive_address_count||0),change_addresses:Number(aggregate.change_address_count||0),receive_used:Number(aggregate.receive_used_count||0),change_used:Number(aggregate.change_used_count||0),balance_sats:overviewBalance===null?Number(aggregate.balance_sats||0):overviewBalance,utxo_count:Number(aggregate.utxo_count||0),baseline_complete:Boolean(aggregate.baseline_complete),last_activity:last};'''
          if summary not in app: raise SystemExit('runtime summary return missing')
          app=app.replace(summary,'''return {addresses:Number(aggregate.address_count||0),receive_addresses:Number(aggregate.receive_address_count||0),change_addresses:Number(aggregate.change_address_count||0),receive_used:Number(aggregate.receive_used_count||0),change_used:Number(aggregate.change_used_count||0),balance_sats:overviewBalance===null?Number(aggregate.balance_sats||0):overviewBalance,utxo_count:Number(aggregate.utxo_count||0),baseline_complete:Boolean(aggregate.baseline_complete),resolved_address_type:String(aggregate.resolved_address_type||""),resolved_address_type_verified:Boolean(aggregate.resolved_address_type_verified),last_activity:last};''',1)
          balance='''balanceText=state.discreet?"••••":`${fmtNumber(Number(runtime.balance_sats||0)/SATsFix(),8)} BTC`'''
          if balance not in app: raise SystemExit('wallet balance expression missing')
          app=app.replace(balance,'''xpubResolving=mon.kind==="xpub"&&String(mon.address_type||"auto")==="auto"&&!runtime.resolved_address_type_verified,balanceText=state.discreet?"••••":xpubResolving?walletWatchLang("Wird ermittelt …","Detecting …"):`${fmtNumber(Number(runtime.balance_sats||0)/SATsFix(),8)} BTC`''',1)
          renderer='''function renderMarketAssessmentBackfillStatus(payload=state.marketAssessmentHistory){
            const host=$("#marketAssessmentBackfillStatus");if(!host)return;const s=payload?.intraday_backfill||{};
            if(!Object.keys(s).length){host.textContent=walletWatchLang("90-Tage-Rückrechnung wartet auf Start …","90-day reconstruction waiting to start …");return;}
            const cached=Number(s.cached_points||0),live=Number(s.live_points||0),backfilled=Number(s.backfilled_points||0),source=Number(s.source_points||0),done=Number(s.completed_points||cached),target=source>0?source:Number(s.expected_full_grid_points||25920),pct=target>0?Math.max(0,Math.min(100,done/target*100)):0,complete=Boolean(s.complete),remaining=Math.max(0,Number(s.remaining_points||target-done));
            host.textContent=walletWatchLang(`${complete?"✓":"⏳"} 90-Tage-Rückrechnung: ${fmtNumber(done,0)} / ${fmtNumber(target,0)} · ${fmtNumber(pct,1)} % · ${complete?"vollständig":String(s.state||"läuft gedrosselt")} · Cache ${fmtNumber(cached,0)} (live ${fmtNumber(live,0)} / rückgerechnet ${fmtNumber(backfilled,0)}) · Bitstamp 5m · Tor only${remaining?` · verbleibend ${fmtNumber(remaining,0)}`:""}`,`${complete?"✓":"⏳"} 90-day reconstruction: ${fmtNumber(done,0)} / ${fmtNumber(target,0)} · ${fmtNumber(pct,1)}% · ${complete?"complete":String(s.state||"throttled")} · cache ${fmtNumber(cached,0)} (live ${fmtNumber(live,0)} / backfilled ${fmtNumber(backfilled,0)}) · Bitstamp 5m · Tor only${remaining?` · ${fmtNumber(remaining,0)} remaining`:""}`);host.className=`result market-assessment-backfill-status ${complete?"positive":""}`;
          }
          '''
          marker='function renderMarketAssessmentHistory(){'
          if marker not in app: raise SystemExit('history renderer marker missing')
          app=app.replace(marker,renderer+marker,1)
          line='''  const payload=state.marketAssessmentHistory,rawPoints=marketAssessmentLiveTailPoints(payload,{includeIntraday:true}),points=smoothMarketAssessmentPoints(rawPoints);'''
          if line not in app: raise SystemExit('history payload line missing')
          app=app.replace(line,line+'\n  renderMarketAssessmentBackfillStatus(payload);',1)
          appp.write_text(app,encoding='utf-8')

          # Small source-level regressions for exactly these three issues.
          test=root/'tests'/'test_xpub_backfill_rating_regressions.py'
          test.write_text('''from pathlib import Path\nR=Path(__file__).resolve().parents[1]\nC=R/"custom_components"/"bitcoin_stack_tracker"\nW=(C/"wallet_watch.py").read_text()\nA=(C/"frontend"/"static"/"app.js").read_text()\nI=(C/"__init__.py").read_text()\nB=(C/"buy_opportunity.py").read_text()\nM=(C/"market_assessment_backfill.py").read_text()\ndef test_xpub_auto_is_verified_before_zero_is_final():\n assert "blockchain.scripthash.subscribe" in W\n assert 'return "p2wpkh", False' in W\n assert "resolved_address_type_verified" in W\n assert "Wird ermittelt …" in A\ndef test_backfill_progress_is_visible_and_throttled():\n assert "async_market_assessment_backfill_loop" in I\n assert "intraday_backfill" in I\n assert "BACKFILL_SCORE_BATCH_POINTS = 2" in M\n assert "marketAssessmentBackfillStatus" in A\n assert "Bitstamp 5m" in A\ndef test_rating_names_are_display_only():\n assert "score_affecting_settings" in B\n assert 'payload.pop("labels", None)' in B\n assert "label_extreme" in A\n assert "buy_opportunity_settings?.labels" in A\n''',encoding='utf-8')

      - name: Validate patched source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/bitcoin_stack_tracker
          node --check custom_components/bitcoin_stack_tracker/frontend/static/app.js
          node --check custom_components/bitcoin_stack_tracker/frontend/static/panel.js
          pytest -q tests/test_xpub_backfill_rating_regressions.py tests/test_sentinel_market_regressions.py tests/test_market_assessment_ui.py tests/test_chart_independent_scales.py tests/test_release_features.py

      - name: Commit final patch and restore normal validation
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD^ -- .github/workflows/validate.yml
          rm -f .github/workflows/agent-xpub-backfill-labels.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix XPUB discovery and expose market backfill progress"
          git push origin HEAD:agent/sentinel-market-cache-cleanup

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

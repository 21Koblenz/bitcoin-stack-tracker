name: Agent v0.21.0.15 PR trigger

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/agent-v021015-pr-trigger.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v0.21.0.15-hacs-upgrade-progress
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply embedded patch and validation
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import textwrap

          source_text = Path('.github/workflows/agent-v021015-upgrade-fix.yml').read_text(encoding='utf-8')
          # main already advanced the outer panel cache key from 8 to 9 after
          # v0.21.0.14 was published, while index.html still references r=6.
          # Use a fresh r=10 for this upgrade repair so every existing browser
          # gets a genuinely new URL.
          source_text = source_text.replace(
              "if 'FRONTEND_CACHE_REVISION = \"8\"' not in const:",
              "if 'FRONTEND_CACHE_REVISION = \"9\"' not in const:",
          )
          source_text = source_text.replace(
              "const.replace('FRONTEND_CACHE_REVISION = \"8\"', 'FRONTEND_CACHE_REVISION = \"9\"', 1)",
              "const.replace('FRONTEND_CACHE_REVISION = \"9\"', 'FRONTEND_CACHE_REVISION = \"10\"', 1)",
          )
          source_text = source_text.replace('static/style.css?v=0.21.0.15&r=9', 'static/style.css?v=0.21.0.15&r=10')
          source_text = source_text.replace('static/app.js?v=0.21.0.15&r=9', 'static/app.js?v=0.21.0.15&r=10')
          source_text = source_text.replace('static/performance-math.js?v=0.21.0.15&r=9', 'static/performance-math.js?v=0.21.0.15&r=10')
          source_text = source_text.replace("grep -q 'FRONTEND_CACHE_REVISION = \"9\"'", "grep -q 'FRONTEND_CACHE_REVISION = \"10\"'")
          source_text = source_text.replace('advertised cache revision 8', 'advertised cache revision 9')
          source_text = source_text.replace('Cache-Revision 8', 'Cache-Revision 9')
          source = source_text.splitlines()

          def extract_run(step_name: str) -> str:
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(source) if line.strip() == marker)
              run_index = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
              run_indent = len(source[run_index]) - len(source[run_index].lstrip())
              body = []
              for line in source[run_index + 1:]:
                  if line.strip():
                      indent = len(line) - len(line.lstrip())
                      if indent <= run_indent:
                          break
                  body.append(line)
              return textwrap.dedent('\n'.join(body))

          patch = extract_run('Patch upgrade cache and live reconstruction progress')
          subprocess.run([sys.executable, '-c', patch], check=True)

          validate = extract_run('Validate patch')
          subprocess.run(['bash', '-euxo', 'pipefail', '-c', validate], check=True)

      - name: Commit validated patch and remove temporary workflows
        run: |
          set -euo pipefail
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git rm .github/workflows/agent-v021015-upgrade-fix.yml .github/workflows/agent-v021015-pr-trigger.yml
          git add -A
          git commit -m "Fix HACS upgrade cache and live market backfill progress"
          git push origin HEAD:fix/v0.21.0.15-hacs-upgrade-progress

name: Agent UI follow-up fix

on:
  push:
    branches:
      - agent/sentinel-market-cache-cleanup
    paths:
      - .github/workflows/agent-ui-followup-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/sentinel-market-cache-cleanup
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<10'

      - name: Patch Sentinel auto-lock privacy and reconstruction status
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          comp = root / 'custom_components' / 'bitcoin_stack_tracker'
          app_path = comp / 'frontend' / 'static' / 'app.js'
          app = app_path.read_text(encoding='utf-8')

          # Central privacy cleanup. It is deliberately idempotent so every
          # manual, browser and Core-side auto-lock transition can use it.
          marker = 'function setWalletWatchShowWhenLocked(show){'
          if marker not in app:
              raise SystemExit('Sentinel locked-display setter missing')
          helper = '''function hideLockedWalletWatch(){\n  state.lockedWalletWatchEditId="";\n  state.lockedWalletWatchSaving=false;\n  state.walletWatch=null;\n  state.walletWatchTxOverviews={};\n  const host=$("#lockedWalletWatch");\n  if(host){host.classList.add("hidden");host.innerHTML="";}\n}\n'''
          if 'function hideLockedWalletWatch(){' not in app:
              app = app.replace(marker, helper + marker, 1)

          setter_start = app.index('function setWalletWatchShowWhenLocked(show){')
          setter_end = app.index('\nfunction walletWatchPanelStorageKey()', setter_start)
          setter = '''function setWalletWatchShowWhenLocked(show){\n  const enabled=Boolean(show);\n  localStorage.setItem(walletWatchLockedDisplayStorageKey(),enabled?"1":"0");\n  const input=$("#walletWatchShowWhenLocked");if(input)input.checked=enabled;\n  if(!enabled){hideLockedWalletWatch();return;}\n  if(state.data?.locked){\n    state.lockedWalletWatchEditId="";\n    state.walletWatchTxOverviews={};\n    void loadLockedWalletWatchManagement().then(ok=>{if(ok)renderLockedWalletWatch();else void refreshWalletWatchStatus({silent:true});});\n  }\n}\n'''
          app = app[:setter_start] + setter + app[setter_end:]

          old_locked = '''    state.lockedWalletWatchEditId="";\n    state.walletWatch=null;\n    const showLockedSentinel=walletWatchShowWhenLocked();\n    if(showLockedSentinel){'''
          new_locked = '''    hideLockedWalletWatch();\n    const showLockedSentinel=walletWatchShowWhenLocked();\n    if(showLockedSentinel){'''
          if old_locked in app:
              app = app.replace(old_locked, new_locked, 1)
          elif '    hideLockedWalletWatch();\n    const showLockedSentinel=walletWatchShowWhenLocked();' not in app:
              raise SystemExit('locked loadData Sentinel branch missing')

          old_autolock = '''  autoLockInFlight=true;\n  try{\n    await service("lock_vault",{config_entry_id:state.entryId});\n    toast(t("autoLockTriggered"));\n    state.lastActivityAt=Date.now();\n    await loadData();'''
          new_autolock = '''  autoLockInFlight=true;\n  try{\n    if(!walletWatchShowWhenLocked())hideLockedWalletWatch();\n    await service("lock_vault",{config_entry_id:state.entryId});\n    toast(t("autoLockTriggered"));\n    state.lastActivityAt=Date.now();\n    await loadData();\n    if(!walletWatchShowWhenLocked())hideLockedWalletWatch();'''
          if old_autolock in app:
              app = app.replace(old_autolock, new_autolock, 1)
          elif 'if(!walletWatchShowWhenLocked())hideLockedWalletWatch();\n    await service("lock_vault"' not in app:
              raise SystemExit('browser auto-lock branch missing')

          old_visibility = '''document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state.entryId){void refreshNetworkStatus({silent:true});if(state.activeTab==="settings")void refreshConnectionInventory({silent:true});}});'''
          new_visibility = '''document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state.entryId){void loadData().then(()=>{if(state.data?.locked&&!walletWatchShowWhenLocked())hideLockedWalletWatch();void refreshNetworkStatus({silent:true});if(state.activeTab==="settings")void refreshConnectionInventory({silent:true});}).catch(error=>console.warn("Bitcoin Stack foreground state refresh failed",errorText(error)));}});'''
          if old_visibility in app:
              app = app.replace(old_visibility, new_visibility, 1)
          elif 'Bitcoin Stack foreground state refresh failed' not in app:
              raise SystemExit('visibility refresh branch missing')

          # Do not hard-code Bitstamp or 5 minutes. The backend is authoritative
          # for provider and interval; this also works when local cache/Coinbase
          # supplies the reconstruction.
          status_start = app.index('function renderMarketAssessmentBackfillStatus(')
          status_end = app.index('\nfunction renderMarketAssessmentHistory()', status_start)
          new_status = '''function renderMarketAssessmentBackfillStatus(payload=state.marketAssessmentHistory){\n  const host=$("#marketAssessmentBackfillStatus");if(!host)return;const s=payload?.intraday_backfill||{};\n  if(!Object.keys(s).length){host.textContent=walletWatchLang("90-Tage-Rückrechnung wartet auf Start …","90-day reconstruction waiting to start …");return;}\n  const cached=Number(s.cached_points||0),live=Number(s.live_points||0),backfilled=Number(s.backfilled_points||0),available=Number(s.available_price_points||0),done=Number(s.completed_points||cached),target=Number(s.expected_source_points||s.expected_full_grid_points||8640),pct=target>0?Math.max(0,Math.min(100,done/target*100)):0,complete=Boolean(s.complete),remaining=Math.max(0,Number(s.remaining_points??(target-done))),interval=Math.max(1,Number(s.interval_minutes||15)),source=String(s.source||walletWatchLang("lokaler Kurscache / Tor-Anbieter","local price cache / Tor provider")),route=String(s.network_route||"Tor only"),stateLabel=complete?walletWatchLang("vollständig","complete"):String(s.state||walletWatchLang("läuft gedrosselt","throttled")),availableLabel=available>0?` · ${walletWatchLang("Kurse verfügbar","prices available")} ${fmtNumber(available,0)}`:"";\n  host.textContent=walletWatchLang(`${complete?"✓":"⏳"} 90-Tage-Rückrechnung: ${fmtNumber(done,0)} / ${fmtNumber(target,0)} · ${fmtNumber(pct,1)} % · ${stateLabel} · Cache ${fmtNumber(cached,0)} (live ${fmtNumber(live,0)} / rückgerechnet ${fmtNumber(backfilled,0)})${availableLabel} · ${source} · ${fmtNumber(interval,0)} min · ${route}${remaining?` · verbleibend ${fmtNumber(remaining,0)}`:""}`,`${complete?"✓":"⏳"} 90-day reconstruction: ${fmtNumber(done,0)} / ${fmtNumber(target,0)} · ${fmtNumber(pct,1)}% · ${stateLabel} · cache ${fmtNumber(cached,0)} (live ${fmtNumber(live,0)} / backfilled ${fmtNumber(backfilled,0)})${availableLabel} · ${source} · ${fmtNumber(interval,0)} min · ${route}${remaining?` · ${fmtNumber(remaining,0)} remaining`:""}`);\n  host.className=`result market-assessment-backfill-status ${complete?"positive":""}`;\n}\n'''
          app = app[:status_start] + new_status + app[status_end:]
          if 'Bitstamp 5m · Tor only' in app:
              raise SystemExit('stale Bitstamp 5m status label remains')
          app_path.write_text(app, encoding='utf-8')

          const_path = comp / 'const.py'
          const = const_path.read_text(encoding='utf-8')
          if 'FRONTEND_CACHE_REVISION = "6"' in const:
              const = const.replace('FRONTEND_CACHE_REVISION = "6"', 'FRONTEND_CACHE_REVISION = "7"', 1)
          elif 'FRONTEND_CACHE_REVISION = "7"' not in const:
              raise SystemExit('unexpected frontend cache revision')
          const_path.write_text(const, encoding='utf-8')

          regression_path = root / 'tests' / 'test_xpub_backfill_rating_regressions.py'
          regression = regression_path.read_text(encoding='utf-8')
          regression = regression.replace(
              '    assert "Bitstamp 5m" in APP\n',
              '    assert "Bitstamp 5m · Tor only" not in APP\n    assert "s.interval_minutes||15" in APP\n    assert "s.network_route||\\"Tor only\\"" in APP\n',
              1,
          )
          regression_path.write_text(regression, encoding='utf-8')

          ui_test = root / 'tests' / 'test_sentinel_autolock_visibility.py'
          ui_test.write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nAPP = (ROOT / "custom_components" / "bitcoin_stack_tracker" / "frontend" / "static" / "app.js").read_text(encoding="utf-8")\n\n\ndef test_locked_sentinel_privacy_is_reapplied_on_all_auto_lock_paths():\n    assert "function hideLockedWalletWatch(){" in APP\n    assert "if(!enabled){hideLockedWalletWatch();return;}" in APP\n    assert "if(!walletWatchShowWhenLocked())hideLockedWalletWatch();" in APP\n    assert 'document.addEventListener("visibilitychange"' in APP\n    assert "void loadData().then" in APP\n    assert "state.data?.locked&&!walletWatchShowWhenLocked()" in APP\n\n\ndef test_reconstruction_status_uses_backend_source_interval_and_route():\n    assert "Bitstamp 5m · Tor only" not in APP\n    assert "s.interval_minutes||15" in APP\n    assert "s.source||walletWatchLang" in APP\n    assert 's.network_route||"Tor only"' in APP\n''', encoding='utf-8')

      - name: Validate production files
        run: |
          python -m compileall -q custom_components/bitcoin_stack_tracker
          node --check custom_components/bitcoin_stack_tracker/frontend/static/app.js
          node --check custom_components/bitcoin_stack_tracker/frontend/panel.js
          pytest -q tests/test_xpub_backfill_rating_regressions.py tests/test_sentinel_autolock_visibility.py

      - name: Commit fix and remove temporary workflows
        run: |
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git rm -f .github/workflows/agent-ui-followup-fix.yml
          if [ -f .github/workflows/agent-autolock-backfill-fix.yml ]; then git rm -f .github/workflows/agent-autolock-backfill-fix.yml; fi
          git add \
            custom_components/bitcoin_stack_tracker/frontend/static/app.js \
            custom_components/bitcoin_stack_tracker/const.py \
            tests/test_xpub_backfill_rating_regressions.py \
            tests/test_sentinel_autolock_visibility.py
          git commit -m "Fix Sentinel auto-lock privacy and backfill status UI"
          git push origin HEAD:agent/sentinel-market-cache-cleanup

name: Agent v0.21.0.15 HACS upgrade fix

on:
  push:
    branches:
      - fix/v0.21.0.15-hacs-upgrade-progress
    paths:
      - .github/workflows/agent-v021015-upgrade-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/v0.21.0.15-hacs-upgrade-progress
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Patch upgrade cache and live reconstruction progress
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          old = '0.21.0.14'
          new = '0.21.0.15'

          version_files = [
              root / 'VERSION.txt',
              root / 'README.md',
              root / 'custom_components/bitcoin_stack_tracker/manifest.json',
              root / 'custom_components/bitcoin_stack_tracker/const.py',
              root / 'custom_components/bitcoin_stack_tracker/wallet_watch.py',
              root / 'custom_components/bitcoin_stack_tracker/frontend/index.html',
              root / 'custom_components/bitcoin_stack_tracker/frontend/panel.js',
              root / 'custom_components/bitcoin_stack_tracker/frontend/static/app.js',
          ]
          for path in version_files:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected {old} in {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          const_path = root / 'custom_components/bitcoin_stack_tracker/const.py'
          const = const_path.read_text(encoding='utf-8')
          if 'FRONTEND_CACHE_REVISION = "8"' not in const:
              raise SystemExit('expected frontend cache revision 8')
          const_path.write_text(const.replace('FRONTEND_CACHE_REVISION = "8"', 'FRONTEND_CACHE_REVISION = "9"', 1), encoding='utf-8')

          index_path = root / 'custom_components/bitcoin_stack_tracker/frontend/index.html'
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('static/style.css?v=0.21.0.15&r=6', 'static/style.css?v=0.21.0.15&r=9')
          index = index.replace('static/app.js?v=0.21.0.15&r=6', 'static/app.js?v=0.21.0.15&r=9')
          index = index.replace('static/performance-math.js?v=0.21.0.15"', 'static/performance-math.js?v=0.21.0.15&r=9"')
          if '&r=6' in index:
              raise SystemExit('stale r=6 asset reference remains')
          index_path.write_text(index, encoding='utf-8')

          init_path = root / 'custom_components/bitcoin_stack_tracker/__init__.py'
          init = init_path.read_text(encoding='utf-8')
          marker = '        if route == "api/market-assessment/history" and method == "GET":\n'
          if marker not in init:
              raise SystemExit('market history route marker missing')
          if 'api/market-assessment/backfill-status' not in init:
              route = '''        if route == "api/market-assessment/backfill-status" and method == "GET":\n            entry_id = q("entry_id")\n            runtime = _runtime(self.hass, entry_id)\n            try:\n                runtime["security"].require_owner(requester)\n            except VaultAccessDenied as err:\n                raise web.HTTPForbidden(text="Owner access is required") from err\n            entry = self.hass.config_entries.async_get_entry(entry_id)\n            if entry is None:\n                raise web.HTTPBadRequest(text="Config entry was not found")\n            current_settings = effective_settings(entry)\n            currencies = configured_currencies(current_settings)\n            market_settings = normalize_buy_opportunity_settings(\n                current_settings.get(CONF_BUY_OPPORTUNITY_SETTINGS), currencies\n            )\n            intraday_signature = await self.hass.async_add_executor_job(partial(\n                market_assessment_intraday_signature,\n                currency=market_settings["currency"],\n                settings=market_settings,\n            ))\n            backfill_status = deepcopy(runtime.get("market_assessment_backfill_status") or {})\n            intraday_cache = runtime.get("market_assessment_intraday_cache")\n            if intraday_cache is not None:\n                backfill_status.update(await intraday_cache.async_stats(intraday_signature))\n            return respond({"intraday_backfill": backfill_status})\n\n'''
              init = init.replace(marker, route + marker, 1)
          init_path.write_text(init, encoding='utf-8')

          app_path = root / 'custom_components/bitcoin_stack_tracker/frontend/static/app.js'
          app = app_path.read_text(encoding='utf-8')
          app = app.replace(
              'let marketAssessmentPollTimer = null;\nlet marketAssessmentRefreshInFlight = false;\n',
              'let marketAssessmentPollTimer = null;\nlet marketAssessmentRefreshInFlight = false;\nlet marketAssessmentBackfillPollTimer = null;\nlet marketAssessmentBackfillRefreshInFlight = false;\n',
              1,
          )
          status_end = '  host.className=`result market-assessment-backfill-status ${complete?"positive":""}`;\n}\n\nfunction renderMarketAssessmentHistory(){\n'
          if status_end not in app:
              raise SystemExit('backfill status renderer marker missing')
          status_helpers = '''  host.className=`result market-assessment-backfill-status ${complete?"positive":""}`;\n}\n\nasync function refreshMarketAssessmentBackfillStatus({silent=true}={}){\n  if(marketAssessmentBackfillRefreshInFlight||!state.entryId||!state.data||state.data.locked)return false;\n  const requestedEntry=state.entryId;\n  marketAssessmentBackfillRefreshInFlight=true;\n  try{\n    const result=await api(`api/market-assessment/backfill-status?entry_id=${encodeURIComponent(requestedEntry)}`,{timeoutMs:7000});\n    if(requestedEntry!==state.entryId||!state.data)return false;\n    const status=result?.intraday_backfill&&typeof result.intraday_backfill==="object"?result.intraday_backfill:{};\n    state.marketAssessmentHistory={...(state.marketAssessmentHistory||{}),intraday_backfill:status};\n    renderMarketAssessmentBackfillStatus(state.marketAssessmentHistory);\n    return true;\n  }catch(error){\n    if(!silent)toast(errorText(error));\n    return false;\n  }finally{marketAssessmentBackfillRefreshInFlight=false;}\n}\n\nfunction renderMarketAssessmentHistory(){\n'''
          app = app.replace(status_end, status_helpers, 1)
          app = app.replace(
              '  renderMarketAssessmentBackfillStatus(payload);\n',
              '  renderMarketAssessmentBackfillStatus(payload);\n  if(state.activeTab==="market")void refreshMarketAssessmentBackfillStatus({silent:true});\n',
              1,
          )
          old_poll = '''function startMarketAssessmentPolling(){\n  if(marketAssessmentPollTimer)clearInterval(marketAssessmentPollTimer);\n  // Core shares one executor-backed 5-minute assessment cache between the\n  // sensor and every panel client. Poll only where the score is visible; other\n  // tabs must not keep waking the model/API in the background.\n  marketAssessmentPollTimer=setInterval(()=>{\n    if(document.hidden||!(state.activeTab==="overview"||state.activeTab==="market"))return;\n    void refreshMarketAssessment({silent:true});\n  },300000);\n}\n'''
          new_poll = '''function startMarketAssessmentPolling(){\n  if(marketAssessmentPollTimer)clearInterval(marketAssessmentPollTimer);\n  if(marketAssessmentBackfillPollTimer)clearInterval(marketAssessmentBackfillPollTimer);\n  // Core shares one executor-backed 15-minute assessment cache between the\n  // sensor and every panel client. Poll the score only where it is visible.\n  marketAssessmentPollTimer=setInterval(()=>{\n    if(document.hidden||!(state.activeTab==="overview"||state.activeTab==="market"))return;\n    void refreshMarketAssessment({silent:true});\n  },300000);\n  // Reconstruction progress is an in-memory/cache-stat read only: no model\n  // calculation and no external request. Keep it live while the market tab is open.\n  marketAssessmentBackfillPollTimer=setInterval(()=>{\n    if(document.hidden||state.activeTab!=="market")return;\n    void refreshMarketAssessmentBackfillStatus({silent:true});\n  },30000);\n}\n'''
          if old_poll not in app:
              raise SystemExit('market polling block did not match')
          app = app.replace(old_poll, new_poll, 1)
          app = app.replace('lag by up to five minutes.', 'lag by up to 15 minutes.', 1)
          app_path.write_text(app, encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          if '## v0.21.0.15 ' not in changelog:
              entry = '''## v0.21.0.15 — 2026-08-19: HACS upgrade cache & live reconstruction progress\n\n### English\n- Fixed an upgrade-only frontend cache mismatch: the native panel advertised cache revision 8 while `index.html` still loaded `app.js`/CSS with stale revision 6. Fresh installs therefore worked while existing browsers could keep an older v0.21.0.14 frontend after a HACS update.\n- All stable frontend assets now use the same release/cache-busting revision.\n- Added a lightweight reconstruction-status endpoint that reads only in-memory/cache statistics and performs no model calculation or public network request.\n- While the Market Assessment tab is visible, 90-day reconstruction progress refreshes every 30 seconds without reloading the heavy history chart.\n- Custom Integration: **v0.21.0.15**. Tor Gateway: **v0.21.0.3 unchanged**.\n\n### Deutsch\n- Upgrade-spezifischen Frontend-Cache-Fehler behoben: Das native Panel meldete Cache-Revision 8, während `index.html` `app.js`/CSS noch mit der alten Revision 6 lud. Neuinstallationen funktionierten deshalb, während bestehende Browser nach einem HACS-Update alte v0.21.0.14-Assets behalten konnten.\n- Alle stabilen Frontend-Dateien verwenden jetzt konsistent dieselbe Release-/Cache-Busting-Revision.\n- Neuer leichter Rückrechnungs-Status-Endpunkt: liest nur Runtime-/Cache-Statistiken, ohne Modellberechnung und ohne öffentliche Netzwerkabfrage.\n- Solange der Tab Markteinschätzung sichtbar ist, aktualisiert sich der Fortschritt der 90-Tage-Rückrechnung alle 30 Sekunden, ohne den schweren History-Chart neu zu laden.\n- Custom Integration: **v0.21.0.15**. Tor Gateway: **v0.21.0.3 unverändert**.\n\n'''
              changelog = changelog.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'Current project version: **v0.21.0.15**.',
              'Current project version: **v0.21.0.15**. This patch fixes HACS-upgrade frontend cache invalidation and keeps 90-day reconstruction progress live without adding model or network load.',
              1,
          )
          readme = readme.replace(
              'Aktueller Projektstand: **v0.21.0.15**.',
              'Aktueller Projektstand: **v0.21.0.15**. Dieses Patch-Release behebt die Frontend-Cache-Invalidierung bei HACS-Updates und hält den Fortschritt der 90-Tage-Rückrechnung ohne zusätzliche Modell- oder Netzwerklast live.',
              1,
          )
          readme_path.write_text(readme, encoding='utf-8')

          test_path = root / 'tests/test_hacs_upgrade_market_progress.py'
          test_path.write_text('''from pathlib import Path\nimport re\n\nROOT = Path(__file__).resolve().parents[1]\nCOMP = ROOT / "custom_components" / "bitcoin_stack_tracker"\nCONST = (COMP / "const.py").read_text(encoding="utf-8")\nINDEX = (COMP / "frontend/index.html").read_text(encoding="utf-8")\nAPP = (COMP / "frontend/static/app.js").read_text(encoding="utf-8")\nINIT = (COMP / "__init__.py").read_text(encoding="utf-8")\n\n\ndef test_frontend_assets_share_release_and_cache_revision():\n    version = re.search(r'FRONTEND_BUILD = "([^"]+)"', CONST).group(1)\n    revision = re.search(r'FRONTEND_CACHE_REVISION = "([^"]+)"', CONST).group(1)\n    assert f'static/style.css?v={version}&r={revision}' in INDEX\n    assert f'static/app.js?v={version}&r={revision}' in INDEX\n    assert f'static/performance-math.js?v={version}&r={revision}' in INDEX\n    assert '&r=6' not in INDEX\n\n\ndef test_reconstruction_progress_has_lightweight_live_endpoint():\n    assert 'api/market-assessment/backfill-status' in INIT\n    block = INIT.split('if route == "api/market-assessment/backfill-status"', 1)[1].split('if route == "api/market-assessment/history"', 1)[0]\n    assert 'async_market_assessment(' not in block\n    assert 'async_stats(intraday_signature)' in block\n    assert 'intraday_backfill' in block\n\n\ndef test_market_tab_polls_only_lightweight_progress_every_30_seconds():\n    assert 'marketAssessmentBackfillPollTimer=setInterval' in APP\n    assert 'state.activeTab!=="market"' in APP\n    assert 'refreshMarketAssessmentBackfillStatus({silent:true})' in APP\n    poll = APP.split('marketAssessmentBackfillPollTimer=setInterval', 1)[1].split('function startNetworkPolling', 1)[0]\n    assert '},30000);' in poll\n    assert 'api/market-assessment/backfill-status?' in APP\n''', encoding='utf-8')

      - name: Validate patch
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8,<10'
          python -m compileall -q custom_components/bitcoin_stack_tracker
          node --check custom_components/bitcoin_stack_tracker/frontend/static/app.js
          node --check custom_components/bitcoin_stack_tracker/frontend/panel.js
          node tests/performance_math_test.js
          pytest -q tests/test_hacs_upgrade_market_progress.py tests/test_market_backfill_lifecycle.py tests/test_sentinel_autolock_visibility.py tests/test_xpub_backfill_rating_regressions.py tests/test_release_features.py tests/test_github_release_surface.py tests/test_buy_opportunity.py
          test "$(tr -d '[:space:]' < VERSION.txt)" = "0.21.0.15"
          grep -q '"version": "0.21.0.15"' custom_components/bitcoin_stack_tracker/manifest.json
          grep -q 'FRONTEND_CACHE_REVISION = "9"' custom_components/bitcoin_stack_tracker/const.py

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git rm .github/workflows/agent-v021015-upgrade-fix.yml
          git add VERSION.txt README.md CHANGELOG.md \
            custom_components/bitcoin_stack_tracker/manifest.json \
            custom_components/bitcoin_stack_tracker/const.py \
            custom_components/bitcoin_stack_tracker/__init__.py \
            custom_components/bitcoin_stack_tracker/wallet_watch.py \
            custom_components/bitcoin_stack_tracker/frontend/index.html \
            custom_components/bitcoin_stack_tracker/frontend/panel.js \
            custom_components/bitcoin_stack_tracker/frontend/static/app.js \
            tests/test_hacs_upgrade_market_progress.py
          git commit -m "Fix HACS upgrade cache and live market backfill progress"
          git push origin HEAD:fix/v0.21.0.15-hacs-upgrade-progress

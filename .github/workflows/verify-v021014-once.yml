name: Verify v0.21.0.14 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-v021014-once.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify release, target and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: dedde81595e502cf5643c29dda42aae52975bfc3
        run: |
          set -euo pipefail
          rm -rf /tmp/release-check
          mkdir -p /tmp/release-check
          ok=0
          for attempt in $(seq 1 30); do
            rm -f /tmp/release-check/*
            if gh release view v0.21.0.14 --json tagName,targetCommitish,isDraft,isPrerelease >/tmp/release.json 2>/dev/null \
              && gh release download v0.21.0.14 -p 'bitcoin-stack-tracker-v0.21.0.14.zip' -p 'bitcoin-stack-tracker-v0.21.0.14.zip.sha256' -D /tmp/release-check >/dev/null 2>&1 \
              && (cd /tmp/release-check && sha256sum -c bitcoin-stack-tracker-v0.21.0.14.zip.sha256); then
              ok=1
              break
            fi
            sleep 10
          done
          test "${ok}" = "1"
          tag_target="$(git rev-list -n 1 v0.21.0.14)"
          test "${tag_target}" = "${TARGET_SHA}"
          test "$(git show v0.21.0.14:VERSION.txt | tr -d '[:space:]')" = "0.21.0.14"
          gh pr comment 1 --body "RELEASE_VERIFIED v0.21.0.14 · target ${TARGET_SHA} · ZIP + SHA256 downloaded and checksum verified · draft=false/prerelease=false expected by publisher."

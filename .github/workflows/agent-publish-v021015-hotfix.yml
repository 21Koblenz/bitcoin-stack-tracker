name: Publish v0.21.0.15 hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-publish-v021015-hotfix.yml

permissions:
  contents: write

env:
  RELEASE_TAG: v0.21.0.15
  RELEASE_VERSION: 0.21.0.15
  RELEASE_TARGET: b0d29189e55480de6f16d3702b7729f6ff77d730

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${RELEASE_TARGET}^{commit}"
          test "$(git show "${RELEASE_TARGET}:VERSION.txt" | tr -d '[:space:]')" = "${RELEASE_VERSION}"
          test "$(git show "${RELEASE_TARGET}:custom_components/bitcoin_stack_tracker/manifest.json" | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "${RELEASE_VERSION}"

      - name: Publish GitHub hotfix release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists; leaving existing release unchanged."
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## Bitcoin Stack Tracker v0.21.0.15 · Hotfix

          This hotfix fixes the HACS-upgrade-only frontend issue that could leave an older Bitcoin Stack Tracker UI active after the integration files and Home Assistant Core had already been updated.

          ### Fixes
          - Unified frontend cache-busting to **v0.21.0.15 / revision 10** for the panel, iframe, `index.html`, CSS, app JS and performance math.
          - Hardened the Home Assistant panel identity with build + cache revision so stale panel configuration cannot keep an older frontend generation alive.
          - Reset the locked-vault Sats Sentinel display opt-in to a new privacy-first generation; after the hotfix, locked Sentinel stays hidden unless explicitly enabled again.
          - Added a lightweight 90-day reconstruction progress endpoint and a 30-second progress refresh while the Market Assessment tab is visible, without recalculating the model or making public/Tor requests.
          - Existing **15-minute / 90-day** market reconstruction and Tor-only fail-closed networking remain unchanged.

          ### Verification
          - Real HACS upgrade-path acceptance test: **passed** on an existing installation without deleting `.storage`.
          - Focused hardening/regression suite: **48/48 passed**.
          - Python compile: passed.
          - JavaScript syntax checks: passed.
          - Performance-math numeric tests: passed.
          - HACS validation: passed.
          - Hassfest validation: passed.
          - Dependency security: passed.

          Custom Integration: **v0.21.0.15**  
          Tor Gateway: **v0.21.0.3 unchanged**
          EOF
          gh release create "${RELEASE_TAG}" \
            --target "${RELEASE_TARGET}" \
            --title "v0.21.0.15 · HACS upgrade hotfix" \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Remove temporary publisher workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Einundzwanzig Koblenz"
          git config user.email "koblenzeinundzwanzig@proton.me"
          git rm .github/workflows/agent-publish-v021015-hotfix.yml
          git commit -m "Remove temporary v0.21.0.15 publisher workflow"
          git push origin HEAD:main

name: Apply complete Sentinel and market fixes

on:
  push:
    branches:
      - agent/sentinel-market-cache-cleanup
    paths:
      - .github/workflows/agent-apply-sentinel-market-fixes.yml

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v5
        with:
          ref: agent/sentinel-market-cache-cleanup
          fetch-depth: 0

      - name: Apply complete fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, got {count}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def ensure_replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Neither old nor new form found in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          app = "custom_components/bitcoin_stack_tracker/frontend/static/app.js"
          init = "custom_components/bitcoin_stack_tracker/__init__.py"
          css = "custom_components/bitcoin_stack_tracker/frontend/static/style.css"
          index = "custom_components/bitcoin_stack_tracker/frontend/index.html"
          const = "custom_components/bitcoin_stack_tracker/const.py"
          cache = "custom_components/bitcoin_stack_tracker/market_assessment_intraday_cache.py"
          market_test = "tests/test_market_assessment_ui.py"
          scale_test = "tests/test_chart_independent_scales.py"

          # -----------------------------------------------------------------
          # Market assessment: real five-minute observations, 90-day retention
          # -----------------------------------------------------------------
          ensure_replace(cache, "_STORAGE_VERSION = 2", "_STORAGE_VERSION = 1")
          cache_text = Path(cache).read_text(encoding="utf-8")
          for required in (
              "_RETENTION_DAYS = 90",
              "_BUCKET_MINUTES = 5",
              "_BUCKETS_PER_DAY = (24 * 60) // _BUCKET_MINUTES",
              "_SAVE_DELAY_SECONDS = 60 * 60",
              "def _bucket_key(stamp: datetime) -> str:",
              "Record one already-calculated model sample per five-minute bucket.",
          ):
              if required not in cache_text:
                  raise SystemExit(f"Five-minute market cache invariant missing: {required}")

          ensure_replace(init, '                "90d": 31,', '                "90d": 91,')

          ensure_replace(
              app,
              'const payload=state.marketAssessmentHistory,rawPoints=marketAssessmentLiveTailPoints(payload),points=smoothMarketAssessmentPoints(rawPoints);',
              'const payload=state.marketAssessmentHistory,rawPoints=marketAssessmentLiveTailPoints(payload,{includeIntraday:true}),points=smoothMarketAssessmentPoints(rawPoints);',
          )

          # Keep the overview overlay dense enough to consume real five-minute
          # observations for Today. Longer ranges remain compact and cheap.
          ensure_replace(
              app,
              'function marketAssessmentOverlayIntervalMinutesForRange(){\n  if(state.historyRange==="1")return 60;',
              'function marketAssessmentOverlayIntervalMinutesForRange(){\n  if(state.historyRange==="1")return 5;',
          )
          ensure_replace(
              app,
              '  // Refresh the lightweight intraday tail at most once per hour. The expensive\n  // causal daily score cache keeps its own stable server-side content signature.\n  const intradayRevision=shortOverlay?Math.floor(Date.now()/3600000):"daily";',
              '  // Refresh only the lightweight persisted intraday tail once per five-minute\n  // bucket. The expensive causal daily score cache keeps its own stable signature.\n  const intradayRevision=shortOverlay?Math.floor(Date.now()/300000):"daily";',
          )

          ensure_replace(
              app,
              '    const previousHistoryRevision=state.marketAssessmentHistorySourceRevision||marketAssessmentHistorySourceRevision();\n',
              '    const previousHistoryRevision=state.marketAssessmentHistorySourceRevision||marketAssessmentHistorySourceRevision();\n    const previousAssessmentCalculatedAt=String(state.data?.buy_opportunity_calculated_at||"");\n',
          )
          ensure_replace(
              app,
              '    const historyRevisionChanged=previousHistoryRevision!==state.marketAssessmentHistorySourceRevision;\n',
              '    const historyRevisionChanged=previousHistoryRevision!==state.marketAssessmentHistorySourceRevision;\n    const assessmentAdvanced=Boolean(result?.calculated_at&&String(result.calculated_at)!==previousAssessmentCalculatedAt);\n',
          )
          ensure_replace(
              app,
              '      if(historyRevisionChanged)void loadMarketAssessmentHistory();',
              '      if(historyRevisionChanged||assessmentAdvanced)void loadMarketAssessmentHistory({force:true});',
          )
          ensure_replace(
              app,
              '      if(historyRevisionChanged)void ensureChartMarketAssessmentHistory();',
              '      if(historyRevisionChanged||assessmentAdvanced)void ensureChartMarketAssessmentHistory({force:true});',
          )

          # -----------------------------------------------------------------
          # Locked Sats Sentinel: local opt-in + authoritative server owner gate
          # -----------------------------------------------------------------
          ensure_replace(
              app,
              '    const showLockedSentinel=Boolean(state.data.security?.owner)&&walletWatchShowWhenLocked();',
              '    const showLockedSentinel=walletWatchShowWhenLocked();',
          )
          ensure_replace(
              app,
              'async function loadLockedWalletWatchManagement(){\n  if(!state.entryId||!state.data?.security?.owner)return false;\n  try{const response=await api(`api/wallet-watch/manage?entry_id=${encodeURIComponent(state.entryId)}`,{timeoutMs:10000});const previous=state.walletWatch||{};state.walletWatch={...previous,config:response.config||previous.config||{},status:response.status||previous.status||{},notify_services:previous.notify_services||[],activity_log:previous.activity_log||{items:[],page:1,pages:1,total:0,stored_total:0},locked_runtime_snapshot:true};return true;}catch(_error){return false;}\n}',
              'async function loadLockedWalletWatchManagement(){\n  if(!state.entryId||!state.data?.locked)return false;\n  try{const response=await api(`api/wallet-watch/manage?entry_id=${encodeURIComponent(state.entryId)}`,{timeoutMs:10000});const previous=state.walletWatch||{};state.walletWatch={...previous,config:response.config||previous.config||{},status:response.status||previous.status||{},notify_services:previous.notify_services||[],activity_log:previous.activity_log||{items:[],page:1,pages:1,total:0,stored_total:0},locked_runtime_snapshot:true};state.data.security={...(state.data.security||{}),owner:true};return true;}catch(_error){return false;}\n}',
          )
          ensure_replace(
              app,
              '  if(!state.data?.locked||!state.data?.security?.owner||!walletWatchShowWhenLocked()||!state.walletWatch?.status){host.classList.add("hidden");host.innerHTML="";return;}',
              '  if(!state.data?.locked||!walletWatchShowWhenLocked()||!state.walletWatch?.status){host.classList.add("hidden");host.innerHTML="";return;}',
          )

          # Make address accordions explicit on desktop as well as mobile.
          css_path = Path(css)
          css_text = css_path.read_text(encoding="utf-8")
          marker = "/* monitored Sentinel addresses: explicit desktop/mobile accordion */"
          if marker not in css_text:
              css_text += (
                  "\n\n" + marker + "\n"
                  ".sats-sentinel-monitored-addresses>summary{cursor:pointer;user-select:none}\n"
                  ".sats-sentinel-monitored-addresses:not([open])>.sats-sentinel-address-list{display:none!important}\n"
              )
              css_path.write_text(css_text, encoding="utf-8")

          # -----------------------------------------------------------------
          # Independent logarithmic axes: signed P/L uses symmetric log (SymLog)
          # -----------------------------------------------------------------
          ensure_replace(
              app,
              'linear:"Linear",logarithmic:"Logarithmisch",logUnavailable:"Für Gewinn-/Verlust-Ansichten ist nur die lineare Skala möglich.",marketScoreLinearOnly:',
              'linear:"Linear",logarithmic:"Logarithmisch",symlogarithmic:"SymLog",logUnavailable:"Für diese Datenreihe ist keine logarithmische Skala verfügbar.",marketScoreLinearOnly:',
          )
          ensure_replace(
              app,
              'linear:"Linear",logarithmic:"Logarithmic",logUnavailable:"Profit/loss views support the linear scale only.",marketScoreLinearOnly:',
              'linear:"Linear",logarithmic:"Logarithmic",symlogarithmic:"SymLog",logUnavailable:"A logarithmic scale is unavailable for this series.",marketScoreLinearOnly:',
          )
          ensure_replace(
              app,
              '    const logBlocked = Boolean(item?.allowNegative || item?.forceLinear);\n    if (logBlocked && chartAxisScale(index) === "log") setChartAxisScale(index,"linear");\n    const label = chartAxisScale(index) === "log" ? t("logarithmic") : t("linear");',
              '    const logBlocked = Boolean(item?.forceLinear);\n    if (logBlocked && chartAxisScale(index) === "log") setChartAxisScale(index,"linear");\n    const signedLog = Boolean(item?.allowNegative && chartAxisScale(index) === "log");\n    const label = chartAxisScale(index) === "log" ? t(signedLog?"symlogarithmic":"logarithmic") : t("linear");',
          )
          ensure_replace(
              app,
              '  const logarithmic = index => Boolean(series[index] && !series[index].allowNegative && chartAxisScale(index) === "log");\n  $("#overlayOpacity").disabled = !overlay;',
              '  const logarithmic = index => Boolean(series[index] && !series[index].allowNegative && chartAxisScale(index) === "log");\n  const symlogarithmic = index => Boolean(series[index]?.allowNegative && chartAxisScale(index) === "log");\n  const symlogThresholds = series.map(item=>{if(!item?.allowNegative)return 1;const values=Object.values(item.values||{}).map(Number).filter(Number.isFinite).map(Math.abs).filter(value=>value>0);const maxAbs=values.length?Math.max(...values):1;return Math.max(1,maxAbs*.01);});\n  const chartScaleLabel = index => symlogarithmic(index)?t("symlogarithmic"):(logarithmic(index)?t("logarithmic"):t("linear"));\n  $("#overlayOpacity").disabled = !overlay;',
          )
          ensure_replace(
              app,
              '  const transform = (value,index) => logarithmic(index) ? Math.log10(Number(value)) : Number(value);\n  const inverse = (value,index) => logarithmic(index) ? 10 ** Number(value) : Number(value);',
              '  const transform = (value,index) => {const numeric=Number(value);if(logarithmic(index))return Math.log10(numeric);if(symlogarithmic(index)){const threshold=symlogThresholds[index]||1;return Math.sign(numeric)*Math.log10(1+Math.abs(numeric)/threshold);}return numeric;};\n  const inverse = (value,index) => {const numeric=Number(value);if(logarithmic(index))return 10 ** numeric;if(symlogarithmic(index)){const threshold=symlogThresholds[index]||1;return Math.sign(numeric)*threshold*((10 ** Math.abs(numeric))-1);}return numeric;};',
          )
          ensure_replace(
              app,
              '<text class="axis-text" x="${pad.l}" y="18">${esc(series[0].label)} · ${esc(logarithmic(0)?t("logarithmic"):t("linear"))}</text>${overlay?`<text class="axis-text" x="${width-pad.r}" y="18" text-anchor="end">${esc(series[1].label)} · ${esc(logarithmic(1)?t("logarithmic"):t("linear"))}</text>`:""}',
              '<text class="axis-text" x="${pad.l}" y="18">${esc(series[0].label)} · ${esc(chartScaleLabel(0))}</text>${overlay?`<text class="axis-text" x="${width-pad.r}" y="18" text-anchor="end">${esc(series[1].label)} · ${esc(chartScaleLabel(1))}</text>`:""}',
          )

          # -----------------------------------------------------------------
          # Frontend cache busting: stable filenames remain unchanged.
          # -----------------------------------------------------------------
          ensure_replace(const, 'FRONTEND_CACHE_REVISION = "4"', 'FRONTEND_CACHE_REVISION = "5"')
          ensure_replace(index, 'static/style.css?v=0.21.0.13&r=4', 'static/style.css?v=0.21.0.13&r=5')
          ensure_replace(index, 'static/app.js?v=0.21.0.13&r=4', 'static/app.js?v=0.21.0.13&r=5')

          # The UI intentionally polls the shared assessment cache every five minutes.
          ensure_replace(market_test, '    assert "},60000);" in app', '    assert "},300000);" in app')

          # Rewrite independent-scale regression tests for signed SymLog.
          Path(scale_test).write_text('''from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
FRONTEND = ROOT / "custom_components/bitcoin_stack_tracker/frontend"
APP = (FRONTEND / "static/app.js").read_text(encoding="utf-8")
INDEX = (FRONTEND / "index.html").read_text(encoding="utf-8")


def test_chart_has_independent_left_and_right_scale_controls():
    assert 'id="chartScaleLeftButton"' in INDEX
    assert 'id="chartScaleRightButton"' in INDEX
    assert 'bst_chart_scale_left' in APP
    assert 'bst_chart_scale_right' in APP
    assert 'function chartAxisScale(index)' in APP
    assert 'const logarithmic = index =>' in APP
    assert 'const symlogarithmic = index =>' in APP
    assert 'chartScaleLabel(0)' in APP
    assert 'chartScaleLabel(1)' in APP


def test_signed_series_uses_symlog_on_its_own_axis():
    assert 'const logBlocked = Boolean(item?.forceLinear);' in APP
    assert 'const signedLog = Boolean(item?.allowNegative && chartAxisScale(index) === "log");' in APP
    assert 't(signedLog?"symlogarithmic":"logarithmic")' in APP
    assert 'Math.sign(numeric)*Math.log10(1+Math.abs(numeric)/threshold)' in APP
    assert 'Math.sign(numeric)*threshold*((10 ** Math.abs(numeric))-1)' in APP
    assert 'const signedSeries = series.some' not in APP


def test_large_chart_and_ledger_ui_use_revision_caches():
    assert 'const chartTimestampCache = new Map();' in APP
    assert 'derivedCacheKey("chartTimeline"' in APP
    assert 'derivedCacheKey("chartSeries"' in APP
    assert 'function uiIndexes()' in APP
    assert 'matchesBySale=new Map()' in APP
    assert 'openLotByEntry=new Map(' in APP
    assert 'const points = sortedNumericPoints(values);' in APP


def test_market_score_overlay_keeps_linear_but_auto_scaled_right_axis():
    start = APP.index('const marketScoreSeries')
    block = APP[start:APP.index('if(state.fiatFree)', start)]
    assert 'forceLinear:true,publicValue:true' in block
    assert 'fixedMin:0,fixedMax:100' not in block
    assert 'marketScoreLinearOnly' in APP
''', encoding="utf-8")

          # Additional regression coverage for every issue fixed in this pass.
          Path("tests/test_sentinel_market_regressions.py").write_text('''from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
COMPONENT = ROOT / "custom_components" / "bitcoin_stack_tracker"
APP = (COMPONENT / "frontend" / "static" / "app.js").read_text(encoding="utf-8")
CSS = (COMPONENT / "frontend" / "static" / "style.css").read_text(encoding="utf-8")
INIT = (COMPONENT / "__init__.py").read_text(encoding="utf-8")

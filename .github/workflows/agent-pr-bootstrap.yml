name: Apply complete branch patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.head_ref == 'agent/sentinel-market-cache-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable PR branch
        uses: actions/checkout@v5
        with:
          ref: agent/sentinel-market-cache-cleanup
          fetch-depth: 0

      - name: Extract and execute the reviewed one-shot patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          workflow = Path('.github/workflows/agent-apply-sentinel-market-fixes.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = '      - name: Apply complete fixes\n        shell: python\n        run: |\n'
          start = text.index(marker) + len(marker)
          end = text.index('\n      - name: Validate JavaScript and Python syntax', start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          target = Path('/tmp/apply_complete_fixes.py')
          target.write_text(script, encoding='utf-8')
          subprocess.run([sys.executable, str(target)], check=True)

      - name: Validate JavaScript and Python syntax
        run: |
          node --check custom_components/bitcoin_stack_tracker/frontend/static/app.js
          node --check custom_components/bitcoin_stack_tracker/frontend/panel.js
          python -m compileall -q custom_components/bitcoin_stack_tracker

      - name: Run regression suite
        run: |
          python -m pip install --disable-pip-version-check --no-input pytest
          python -m pytest -q \
            tests/test_market_assessment_ui.py \
            tests/test_chart_independent_scales.py \
            tests/test_release_features.py \
            tests/test_sentinel_market_regressions.py

      - name: Remove bootstrap before commit
        run: rm -f .github/workflows/agent-pr-bootstrap.yml

      - name: Commit complete tested source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/agent-pr-bootstrap.yml
          test ! -e .github/workflows/agent-apply-sentinel-market-fixes.yml
          test ! -e custom_components/bitcoin_stack_tracker/frontend/static/runtime-fixes.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Complete Sentinel market history and chart fixes"
          git push origin HEAD:agent/sentinel-market-cache-cleanup
